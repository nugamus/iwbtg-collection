[package]
name = "iwbtg-tools"
description = "The iwbtg command-line tool: package checks, replays, trace comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Integration tests are listed below; tests/it.rs holds them (#517).
autotests = false

[[bin]]
name = "iwbtg"
path = "src/main.rs"

[dependencies]
iwbtg-sim = { workspace = true, features = ["trace-setup"] }
postcard.workspace = true
iwbtg-format.workspace = true
thiserror.workspace = true
clap.workspace = true
# Trace case files (crates/tools/cases) and the research trace map (docs/plans/sim-core.md 9.2).
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
# `metadata` (only here, so the sim's own graph is unchanged): the registered API as definitions.
rhai = { workspace = true, features = ["metadata"] }
# `iwbtg removals sign` (#1479): the format and the signing live in `iwbtg-removal`, shared with
# the server so the canonical rule has one implementation (#1537). `hex` decodes the seed and
# prints the key, signature and digest.
iwbtg-removal = { workspace = true }
hex = "0.4"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
