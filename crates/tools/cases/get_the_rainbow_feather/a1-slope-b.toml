# Written by hand for #640. The recorder's --gml on frame 3 (a1-slope.md, Setup) stores six
# place_meeting/place_free queries as strings in global.q1..q6 (read back by the
# execute_string(global.qN) columns), destroys the playerKillers with x < 520 and y < 260 and moves
# the kid to (245.0, 215).
# Recorder: --object player --room lasroom01 --at 2 --from 2
source = "get-the-rainbow-feather/a1-slope-b"
kind = "diff"
start = { room = "lasroom01", difficulty = 0 }
at = 2
first_frame = 2
object = "kid"
original_object = "player"
dll_mode = "model"
seed = 0
setup = [
  # with(playerKiller){if(x<520 && y<260){instance_destroy()}}: playerKiller and its children.
  { frame = 3, destroy = "class:killer", rect = [-inf, -inf, 520, 260] },
  { frame = 3, target = "kid", set = { x = 245.0, xprevious = 245.0, y = 215.0, yprevious = 215.0 } },
]
ignore = ["id", "sprite_index", "sprite_name"]
# The F1 evidence: the peak stop and the position after it, exact in both axes.
required = ["kid.x", "kid.y"]

[vars]
"djump" = "kid.djump"
# global.q6 = 'return place_free(x,y+1)'
"execute_string(global.q6)" = "place_free(x,y+1)"
"instance_number(playerKiller)" = "instance_number(class:killer)"

[unprobed]
"execute_string(global.q1)" = "place_meeting(x,y+1,block): no place_meeting probe column"
"execute_string(global.q2)" = "place_meeting(x,y+1,nanameblockL): no place_meeting probe column"
"execute_string(global.q3)" = "place_meeting(x,y+1,nanameblockR): no place_meeting probe column"
"execute_string(global.q4)" = "place_meeting(x,y+5,nanameblockL) || place_meeting(x,y+5,nanameblockR): no place_meeting probe column"
"execute_string(global.q5)" = "place_meeting(x,y+2,nanameblockL) || place_meeting(x,y+2,nanameblockR): no place_meeting probe column"

[rooms]
"lasroom01" = "lasroom01"
