# Imported from research trace showdown/a3-t18-a by `iwbtg trace import`; finish by hand (plan 9.2).
# Recorder: --object player --room room028 --at 2 --from 2 (2 --gml)
source = "showdown/a3-t18-a"
kind = "probe_read"
start = { room = "room_28", difficulty = 0 }
at = 2
first_frame = 2
object = "kid"
original_object = "player"
dll_mode = "model"
seed = 0
setup = []
ignore = ["id", "sprite_index", "sprite_name"]
notes = [
  "global.sv*: save1 read back as bytes (A3.md saveGame: room, x, y as 3 base-100 bytes, difficulty, 8 item/bossitem pairs); split decodes x, y and difficulty, the 16 item bytes are skipped (all 0 here)",
]
latch = { "global.sv.x" = [30], "global.sv.y" = [30], "global.sv.difficulty" = [30] }
split = { "global.sv" = ["room:3", "x:3", "y:3", "difficulty:1", "_:16"] }

[vars]
"global.sv.x" = "save.x"
"global.sv.y" = "save.y"
"global.sv.difficulty" = "save.difficulty"
"instance_number(player)" = "instance_number(kid)"

[unprobed]
"global.sv.room" = "the original's room index; ours is a room id"
"global.death[1]" = "a global array or instance path"
"var:room" = "an expression; the probe reads variables only (OPEN)"

[rooms]
"room_28" = "room028"
