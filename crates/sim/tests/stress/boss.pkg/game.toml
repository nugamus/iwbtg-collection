#:schema ../../../../../docs/format/schema/v0/game.schema.json
# The boss stress package (#991): HP, a phase change, `collide(other)` against kid bullets,
# alarms and a timeline, so the script features bosses use are exercised by one small package.
# Everything here is original and deterministic.
format = 0
id = "boss"
title = "Boss stress"
version = "0.1.0"
engine_rev = 0
runner = "gm80"
physics = "physics.toml"
start_room = "boss_arena"
max_ticks = 180_000
object_order = [
  "world", "kid", "kid_bullet", "bow", "blood", "blood_emitter", "game_over", "playerface",
  "kid_start", "@boss", "@boss_shot",
]

[engine]
new_game_room = "boss_arena"

# The kid's shots need a hitbox to reach the boss's `collide(other)`; the built-in kind takes
# the same 4x4 sprite the boss's own projectiles use, so the package stays one small pair of
# textures.
[defaults.kid_bullet]
sprite = "shot"

[[creators]]
name = "IWBTG Collection"
role = "author"

[source]
url = "https://github.com/nugamus/iwbtg-collection"
permission = "granted"
permission_note = "Original synthetic package made for this repository (a stress test)."

[timing]
start = { trigger = "run_start" }
end = { trigger = "run_end" }
# The boss's script sends the fight to `phase_two` when its first HP bar empties. A room is the
# only phase boundary `replay run` can print, as a split: 0 is the start, 1 this stage.
stages = [
  { id = "phase_one", name = "Phase 1", trigger = "enter_room", room = "phase_two" },
]
