# The retry promise (CLONE_SPEC 1174, #1141): R after a death returns the kid to the saved
# spot after the retry delay, and the first movable tick responds to jump.
id = "lifecycle/retry_after_death"
impact = "F1"
package = "fixture:retry"
start = { new_game = true, difficulty = 0 }
play_mode = "original"
seed = 7
mods = []
evidence = ["golden:kid_a1_basics", "#1141"]

inputs = """
frame 20: press suicide
frame 21: release suicide
frame 40: press restart
frame 41: release restart
frame 43: press jump
frame 44: release jump
frame 60: end
"""

# The suicide is one death, and the room stays up while the kid is gone.
[[assert]]
tick = 21
death = 1
kid_count = 0
room = "room_0"
status = "running"

# The retry delay: the kid is back at the save, and the next tick does not move it.
[[window]]
ticks = [41, 42]
metric = "kid.y"
max_delta = 0.0
why = "the retry delay must not move the kid before control returns"

# At the end of the delay the kid stands at the save, and the death-only save survived the retry.
[[assert]]
tick = 42
room = "room_0"
kid_count = 1
death = 1
kid.x = { exact = 96.0 }
kid.y = { exact = 567.0 }
matches_save = true

# A jump pressed on the first movable tick moves the kid within one frame.
[[assert]]
tick = 44
control = { action = "jump", metric = "kid.y", latency_max = 1 }
why = "a jump pressed on the first movable tick moves the kid within one frame"

[[assert]]
tick = 60
death = 1
kid_count = 1
status = "running"
