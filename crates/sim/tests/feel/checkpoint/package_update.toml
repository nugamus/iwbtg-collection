# A package update cannot move a save (#1150/#1153): save in `fixture:checkpoint`, then load the
# same checkpoint into a package whose rooms were inserted and reordered. The saved room keeps
# its name and the Kid resumes at the saved spot.
#
# The #1161 runner binds `fixture:checkpoint_saved` to the checkpoint written in
# `checkpoint/respawn_alignment` and `fixture:checkpoint_reordered` to the same one-room package
# with two rooms inserted before `room_1` and the others reordered. `start.checkpoint` is the
# save-start form that runner adds; until then this is the reviewable promise.
id = "checkpoint/package_update"
impact = "F1"
package = "fixture:checkpoint_reordered"
ruleset = "gm8@0"
profile = "gm8/a1@1"
start = { checkpoint = "fixture:checkpoint_saved" }
play_mode = "original"
seed = 0
mods = []
evidence = ["#1150", "#1153", "#1019"]

inputs = """
frame 0: end
"""

# The name decides, not the index: `room_1` moved, and the Kid is still on its saved spot.
[[assert]]
tick = 1
room = "room_1"
save.room = "room_1"
matches_save = true
kid_count = 1
