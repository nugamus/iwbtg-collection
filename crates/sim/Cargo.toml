[package]
name = "iwbtg-sim"
description = "Deterministic simulation for IWBTG Collection: world, built-ins, kid physics, scripts, replays"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Integration tests are listed below; tests/it.rs holds most of them (#517).
autotests = false

[dependencies]
rhai.workspace = true
libm.workspace = true
blake3.workspace = true
smallvec.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

# Test harness for wasm32-unknown-unknown under node (#206). Its runner is the wasm-bindgen CLI,
# which must match the wasm-bindgen version in Cargo.lock.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# JSON Schema of `PhysicsProfileDraft` for docs/format/schema/v0/physics.schema.json (#255); the
# format crate's `schema` feature turns it on. Never in the client or the server.
schema = ["dep:schemars"]
# Trace setup actions (docs/plans/sim-core.md 9.4, 10.4). Never enabled in the server build.
trace-setup = []

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "wp1_determinism"
path = "tests/wp1_determinism.rs"

[[test]]
name = "golden_corpus"
path = "tests/golden_corpus.rs"
