[package]
name = "iwbtg-sim"
description = "Deterministic simulation for IWBTG Collection: world, built-ins, kid physics, scripts, replays"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Integration tests are listed below; tests/it.rs holds most of them (#517).
autotests = false

[dependencies]
rhai.workspace = true
libm.workspace = true
blake3.workspace = true
smallvec.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

# Test harness for wasm32-unknown-unknown under node (#206). Its runner is the wasm-bindgen CLI,
# which must match the wasm-bindgen version in Cargo.lock.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
# Allocation counting for the #1021 measurement harness (`tests/script_prep.rs`). Test-only;
# `crates/sim/deny.toml` excludes dev dependencies from the sim's runtime graph.
stats_alloc = "0.1"
# Feel contracts (`tests/feel.rs`, #1167). Test-only: the loader stays out of the sim runtime.
toml.workspace = true
# The stress packages (#1068) are packages, so their test loads them with the real loader. A dev
# dependency may cycle (the format crate depends on the sim); `exclude-dev` keeps it out of the
# sim's runtime graph, and it is test-only for the same reason as the two above.
iwbtg-format.workspace = true

[features]
# JSON Schema of `PhysicsProfileDraft` for docs/format/schema/v0/physics.schema.json (#255); the
# format crate's `schema` feature turns it on. Never in the client or the server; `cargo test -p xtask` fails when `schemars` is in the client's graph (#794).
schema = ["dep:schemars"]
# Trace setup actions (docs/architecture/traces.md; feature rules in
# docs/architecture/sim/determinism.md, Features). Never enabled in the server build.
trace-setup = []

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "determinism"
path = "tests/determinism.rs"

[[test]]
name = "golden_corpus"
path = "tests/golden_corpus.rs"

# The public feel contracts (#1167): the format and runner without the private repos.
[[test]]
name = "feel"
path = "tests/feel.rs"

# The #1021 measurement harness: needs its own binary for a counting global allocator. Ignored
# by default, so the normal test run and the wasm jobs do not pay for it.
[[test]]
name = "script_prep"
path = "tests/script_prep.rs"
