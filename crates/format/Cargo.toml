[package]
name = "iwbtg-format"
description = "Reads, validates, hashes and writes IWBTG Collection game packages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Integration tests are listed below; tests/it.rs holds most of them (#517).
autotests = false

[dependencies]
iwbtg-sim.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
png.workspace = true
blake3.workspace = true
sha2.workspace = true
flate2.workspace = true
crc32fast.workspace = true
thiserror.workspace = true

schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# JSON Schemas for the data files (docs/format/schema/v0), generated from the types here (#212).
schema = ["dep:schemars", "dep:serde_json", "iwbtg-sim/schema"]

[dev-dependencies]
# Turns `schema` on for this crate's own tests, so `cargo test -p iwbtg-format` checks the schemas.
iwbtg-format = { path = ".", features = ["schema"] }
jsonschema.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"

[[test]]
name = "schemas"
path = "tests/schemas.rs"
