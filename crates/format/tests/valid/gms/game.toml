#:schema ../../../../../docs/format/schema/v0/game.schema.json
# A package that names the GameMaker Studio runner; the rules stay the GM8 defaults.
format = 0
id = "gms"
title = "GMS Runner"
version = "0.1.0"
engine_rev = 0
runner = "gms"
physics = "physics.toml"
start_room = "title"
max_ticks = 180_000
object_order = [
  "world", "kid", "kid_bullet", "bow", "blood", "blood_emitter", "game_over", "playerface",
  "block",
]

[[creators]]
name = "IWBTG Collection"
role = "author"

[source]
url = "https://example.com/gms"
permission = "granted"

[timing]
start = { trigger = "run_start" }
end = { trigger = "run_end" }
