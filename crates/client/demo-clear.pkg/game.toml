#:schema ../../../../docs/format/schema/v0/game.schema.json
format = 0
id = "demo_clear"
title = "Demo clear"
version = "0.1.0"
engine_rev = 0
runner = "gm80"
physics = "physics.toml"
start_room = "stage"
max_ticks = 180_000
object_order = [
  "world", "kid", "block", { kind = "spike", dir = "up" }, "kid_start", "warp", "game_clear", "kid_bullet",
  "blood", "blood_emitter", "game_over", "bow", "playerface",
]

[engine]
new_game_room = "stage"
float_model = "f64"

[defaults.kid]
sprite = "kid_idle"
mask = "kid_mask"

[defaults.kid_bullet]
sprite = "kid_bullet"

[defaults.block]
sprite = "block"

[defaults.spike]
sprite = "spike_up"

[defaults.warp]
sprite = "warp"

[defaults.game_clear]
sprite = "clear"

[[creators]]
name = "IWBTG Collection"
role = "author"

[[creators]]
# The Kid sprites and bullet come from this game (CREDITS.md).
name = "waka (I wanna Little Trap)"
role = "other"

[source]
url = "https://github.com/nugamus/iwbtg-collection"
permission = "granted"
permission_note = "Route, blocks, spike, warp and clear are original demo art made for this repository. The Kid sprites are from I wanna Little Trap by waka (CREDITS.md), included by user decision 2026-11-11 (nugamus/iwbtg-collection-games#34)."

[timing]
start = { trigger = "run_start" }
end = { trigger = "run_end" }
stages = [
  { id = "goal", name = "Goal room", trigger = "enter_room", room = "goal" },
]

[[third_party]]
path = "sprites/kid_idle.png"
what = "The Kid (idle), from I wanna Little Trap by waka"
owner = "Kayin (I Wanna Be The Guy Kid sprite); via waka, I wanna Little Trap"
license = "unknown"
status = "to-clear"

