#:schema ../../../../../docs/format/schema/v0/game.schema.json
format = 0
id = "demo_script_error"
title = "Script error fixture"
version = "0.1.0"
engine_rev = 0
runner = "gm80"
physics = "physics.toml"
start_room = "stage"
max_ticks = 180_000
object_order = [
  "world", "kid", "block", { kind = "spike", dir = "up" }, "kid_start", "warp", "game_clear", "kid_bullet",
  "blood", "blood_emitter", "game_over", "bow", "playerface", "@boss",
]

[engine]
new_game_room = "stage"
float_model = "f64"

[defaults.kid]
sprite = "kid"
mask = "kid_mask"

[defaults.kid_bullet]
sprite = "bullet"

[defaults.block]
sprite = "block"

[defaults.spike]
sprite = "spike_up"

[defaults.warp]
sprite = "warp"

[defaults.game_clear]
sprite = "clear"

[[creators]]
name = "IWBTG Collection"
role = "author"

[source]
url = "https://github.com/nugamus/iwbtg-collection"
permission = "granted"
permission_note = "Original placeholder art made for this repository (a test fixture)."

[timing]
start = { trigger = "run_start" }
end = { trigger = "run_end" }
stages = [
  { id = "goal", name = "Goal room", trigger = "enter_room", room = "goal" },
]

