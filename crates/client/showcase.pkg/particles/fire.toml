#:schema ../../../../docs/format/schema/v0/particles.schema.json
# Embers rising from the two braziers, and twinkles around the star.
depth = -5

[types.ember]
shape = "disk"
size = [0.03, 0.06, -0.0005, 0]
speed = [0.8, 1.6]
direction = [80, 100, 0, 10]
color = ["#fff0a0", "#ff9030", "#c03010"]
alpha = [1, 0.8, 0]
additive = true
life = [40, 70]

[types.twinkle]
shape = "star"
size = [0.06, 0.12, -0.002, 0]
orientation = [0, 72, 2, 0]
color = ["#ffffff", "#ffe080"]
alpha = [1, 0]
additive = true
life = [25, 40]

[[emitters]]
region = [458, 470, 514, 520]
shape = "ellipse"
stream = { type = "ember", number = -2 }

[[emitters]]
region = [650, 662, 514, 520]
shape = "ellipse"
stream = { type = "ember", number = -2 }

[[emitters]]
region = [536, 584, 440, 484]
shape = "ellipse"
stream = { type = "twinkle", number = -4 }
