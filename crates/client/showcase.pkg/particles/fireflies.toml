#:schema ../../../../docs/format/schema/v0/particles.schema.json
# Fireflies drifting over the courtyard grass, fading in and out.
depth = -10

[types.firefly]
shape = "disk"
size = [0.04, 0.07]
speed = [0.2, 0.5]
direction = [0, 360, 0, 8]
color = ["#d8ff80", "#fff0a0"]
alpha = [0, 1, 0]
additive = true
life = [120, 200]

[[emitters]]
region = [40, 760, 380, 540]
shape = "ellipse"
stream = { type = "firefly", number = -8 }
burst = { type = "firefly", number = 10 }
