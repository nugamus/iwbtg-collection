#:schema ../../../../docs/format/schema/v0/particles.schema.json
# Snow over the whole room, behind the blocks (they draw at depth 0).
depth = 10

[types.flake]
shape = "snow"
size = [0.1, 0.25, 0, 0.02]
speed = [0.5, 1.5]
direction = [260, 280, 0, 6]
orientation = [0, 360, 2, 0]
color = ["#ffffff", "#9fd0ff"]
alpha = [0.9, 0.9, 0]
life = [300, 400]

[[emitters]]
region = [0, 800, -16, -16]
stream = { type = "flake", number = 2 }

[[emitters]]
region = [0, 800, 0, 608]
burst = { type = "flake", number = 120 }
