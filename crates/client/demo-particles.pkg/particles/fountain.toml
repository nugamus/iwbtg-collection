#:schema ../../../../docs/format/schema/v0/particles.schema.json
# A fountain of glowing sparks over the block in the middle, with a star burst when built.
depth = -10

[types.spark]
shape = "flare"
size = [0.2, 0.4, -0.004, 0]
speed = [4, 6]
direction = [70, 110]
gravity = [0.15, 270]
color = ["#fff4a0", "#ff9020", "#ff2010"]
alpha = [1, 0.8, 0]
additive = true
life = [70, 70]
death = { type = "ember", count = -2 }

[types.ember]
shape = "disk"
size = [0.05, 0.08]
speed = [0.2, 0.6]
direction = [0, 360]
color = ["#ff6020"]
alpha = [1, 0]
additive = true
life = [20, 20]

[types.star]
shape = "star"
size = [0.2, 0.35]
speed = [2, 4]
direction = [0, 360]
orientation = [0, 72, 3, 0]
color_mix = ["#80ffff", "#ff80ff"]
alpha = [1, 0]
life = [200, 200]

[[emitters]]
region = [360, 400, 470, 476]
shape = "ellipse"
distr = "gaussian"
stream = { type = "spark", number = 3 }

[[emitters]]
region = [600, 640, 200, 240]
burst = { type = "star", number = 12 }
