[package]
name = "iwbtg-client"
description = "The IWBTG Collection game client (Bevy)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
iwbtg-sim.workspace = true
iwbtg-format = { workspace = true, features = ["schema"] }
# Features picked by hand: 2D rendering and windowing, no 3D or gamepad yet (those pull system libraries); audio is Ogg Vorbis only.
clap.workspace = true
png.workspace = true
thiserror.workspace = true
toml.workspace = true
postcard.workspace = true
bevy = { version = "0.20.1", default-features = false, features = [
  "2d_bevy_render", "default_app", "std", "bevy_winit", "default_font", "multi_threaded", "bevy_audio", "vorbis", "x11", "wayland", "webgl2",
] }

# Browser storage for settings and save slots on the web build (storage.rs, #473). Bevy's webgl2
# already pulls web-sys; this only turns on the APIs storage.rs uses.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "console"] }

[lints]
workspace = true
