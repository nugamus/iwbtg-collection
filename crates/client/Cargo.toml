[package]
name = "iwbtg-client"
description = "The IWBTG Collection game client (Bevy)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
iwbtg-sim.workspace = true
iwbtg-format = { workspace = true, features = ["schema"] }
# Features picked by hand: 2D rendering, windowing and bevy_ui (docs/decisions/0003-ui-toolkit.md),
# gamepads (bevy_gilrs), no 3D yet (those pull system libraries); audio is Ogg Vorbis only.
clap.workspace = true
png.workspace = true
svgtypes.workspace = true
tiny-skia.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
postcard.workspace = true
bevy = { version = "0.20.1", default-features = false, features = [
  "2d_bevy_render", "default_app", "std", "bevy_winit", "default_font", "multi_threaded", "bevy_gilrs", "bevy_audio", "vorbis", "x11", "wayland", "webgl2",
  "ui_api", "ui_bevy_render", "bevy_ui_widgets", "ui_picking",
] }

# In a browser: Bevy's web support (canvas, timers, asset loading through fetch).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web"] }

# Browser storage for settings and save slots on the web build (storage.rs, #473). Bevy's webgl2
# already pulls web-sys; this only turns on the APIs storage.rs uses.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "console"] }

# Tests read the bundled fonts' cmaps (ui/fonts.rs); bevy_text already builds skrifa through
# parley, so this adds no crate.
[dev-dependencies]
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[lints]
workspace = true
