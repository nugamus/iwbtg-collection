[package]
name = "iwbtg-client"
description = "The IWBTG Collection game client (Bevy)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
iwbtg-sim.workspace = true
iwbtg-format = { workspace = true, features = ["schema"] }
# Features picked by hand: 2D rendering and windowing, no 3D, audio or gamepad yet (those pull system libraries).
clap.workspace = true
png.workspace = true
thiserror.workspace = true
toml.workspace = true
postcard.workspace = true
bevy = { version = "0.20.1", default-features = false, features = [
  "2d_bevy_render", "default_app", "std", "bevy_winit", "default_font", "multi_threaded", "x11", "wayland", "webgl2",
] }

[lints]
workspace = true
