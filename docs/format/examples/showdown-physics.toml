#:schema ../schema/v0/physics.schema.json
# I wanna be the Showdown (family A3, kid/A3.md "Per-game differences: showdown"): the A3 preset
# with a third jump, no bow, no play timer in the kid, the collision and Q-press killers, and the
# bullet at (x, y - 2). Its ice is the last Step action (`ice_temp_hspeed`; the A3 preset has no
# slip in `walk`). The bullet limit of 1 in room046 and room049 is game code (OPEN).
preset = "A3"

[numbers]
jumps = [8.5, 7.0, 6.0]

[jump]
air = "djump_then_tjump"
release_twice_while_tjump = true

[events]
create = ["create_defaults", "ensure_world", "first_play_save"]
step = ["walk", "air_sprite", "fall_cap", "shoot", "jump", "release", "key_flags", "vines", "ice_temp_hspeed"]
end_step = []
alarms = []
keys = [{ action = "suicide", on = "press", run = ["kill"] }]
collisions = [
  { with = "block", run = "block_standard" },
  { with = "platform", run = "platform_standard" },
  { with = "killer", run = "kill" },
]

[flip]
model = "none"               # no gravity flip handover in showdown

[bullet]
offset = [0.0, 2.0]

[sprites]
idle = "kid_idle"
running = "kid_run"
jump = "kid_jump"
fall = "kid_fall"
sliding = "kid_slide"
