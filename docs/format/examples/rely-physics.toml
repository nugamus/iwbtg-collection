#:schema ../schema/v0/physics.schema.json
# The kid's physics profile of I Wanna Rely The Needle 4.2 (family A1, kid/A1.md), written out in
# full. With `preset = "A1"` alone the sim gives the same profile: every value below is the
# preset's. `[sprites]` names come from the package's sprite table.
preset = "A1"

[numbers]
jumps = [8.5, 7.0]            # ground jump, then the air jumps in order
gravity = 0.4
run_speed = 3.0
max_vspeed = 9.0
max_fall_speed = 8.0          # read only by fall_cap = "shift_then_clamp"
release_mult = 0.45
sprite_threshold = 0.05
image_speed_idle = 0.2
image_speed_run = 0.5

[input]
walk = "direct_latch"         # direct_latch | sampled
vine_keys = "edges"           # edges | latched_flags

[events]
create = ["create_defaults", "ensure_world", "first_play_save", "arm_play_timer", "create_bow"]
step = [
  "gravity", "walk", "air_sprite", "fall_cap", "shoot", "jump", "release", "vines", "flip_swap",
  "platform_gravity_zero", "fade_in",
]
boundary = "intersect_origin"
alarms = [{ n = 0, run = ["play_timer"] }]
keys = [{ action = "suicide", on = "press", run = ["kill"] }]
collisions = [
  { with = "block", run = "block_standard" },
  { with = "solidblock", run = "block_standard" },
  { with = "platform", run = "platform_standard" },
  { with = "killer", run = "kill" },
]

[jump]
ground_classes = ["block", "solidblock", "water1"]
ground_also = ["platform_flag", "ladder_jump"]
ground_sets_djump = true
air = "djump"
water_air = "water2_without_flag"

[fall_cap]
rule = "clamp_abs"

[gravity]
reapply = "step"
block_landing_zeroes = true

[platform]
rule = "half_vspeed"
snap = 9.0
take = "vspeed"
hold_probe = 4.0

[vine]
model = "distance_asym"
left_below = 2.0
right_equal = 1.0
slide = 2.0
kick = [15.0, -9.0]
drop = 3.0

[flip]
model = "swap_object"        # the flipped kid is its own object (dormant in rely)

[death]
order = ["sound", "blood_emitter", "destroy_kid", "game_over", "deaths_plus_one", "save_counters"]
select_room_reset = true
stop_music = false

[bullet]
max = 4
speed = 16.0

[save]
position = "xy_base100_bytes"

[misc]
fade_in = true
fade_step = 0.1

[sprites]
idle = "kid_idle"
running = "kid_run"
jump = "kid_jump"
fall = "kid_fall"
sliding = "kid_slide"
