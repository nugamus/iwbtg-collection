<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause C: run sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;family=Pixelify+Sans:wght@500;700&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
/* layout: pause turns the screen into the run's sheet: splits and deaths so far on the left, a frozen half-size game and actions on the right */
.pc-panel{background:rgba(9,11,24,.84);box-shadow:0 -3px 0 0 #2d335e,0 3px 0 0 #2d335e,-3px 0 0 0 #2d335e,3px 0 0 0 #2d335e}
.pc-lbl{font-family:'Silkscreen',monospace;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#a3a9cc}
.pc-num{font-family:'Press Start 2P',monospace;font-variant-numeric:tabular-nums}
.ahead{color:#4be08f}.behind{color:#ff8f5a}.gold{color:#ffd34d}.dim{color:#7d84ad}
.pc-tr{display:grid;grid-template-columns:1.4fr .8fr 1fr 1fr 1fr;align-items:center;height:44px;font-size:22px;font-weight:600;border-bottom:2px solid #1c2142}
.pc-tr .pc-num{font-size:14px;text-align:right}
.pc-tr.cur{background:rgba(255,59,85,.14)}
.pc-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 24px;background:#12152b;font-family:'Pixelify Sans',monospace;font-size:26px;font-weight:700;color:#eef0fa;cursor:pointer;box-shadow:0 -3px 0 0 #2d335e,0 3px 0 0 #2d335e,-3px 0 0 0 #2d335e,3px 0 0 0 #2d335e}
.pc-btn:focus-visible{outline:4px solid #ffd34d;outline-offset:6px}
.pc-btn.sel{background:#ff3b55;box-shadow:0 -3px 0 0 #ff8fa0,0 3px 0 0 #a3122a,-3px 0 0 0 #ff8fa0,3px 0 0 0 #a3122a}
.pc-btn small{font-family:'Silkscreen',monospace;font-size:14px;font-weight:400;letter-spacing:.06em}
.pc-tog{display:flex;align-items:center;gap:10px;font-size:20px;cursor:pointer}
.pc-tog input{width:20px;height:20px;accent-color:#ff3b55;margin:0}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0c18; color: #eef0fa; font-family: 'Barlow Semi Condensed', system-ui, sans-serif">
  <div style="position: absolute; left: 560px; top: 236px; width: 800px; height: 608px; transform: scale(2.6); filter: blur(9px) brightness(.32) saturate(1.2)"><dc-import name="GameScene" hint-size="800px,608px"></dc-import></div>

  <!-- left: the sheet -->
  <div class="pc-panel" style="position: absolute; left: 96px; top: 96px; width: 1040px; height: 888px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 36px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="pc-lbl" style="color: #ff8fa0">Paused · Ranked · Very Hard</span>
        <span style="font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700">Example Fangame</span>
        <span style="font-size: 20px; color: #a3a9cc">Stage 5 of 7 · compared with PB 12:51.30</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 12px; height: 12px; background: #ff3b55; box-shadow: 0 0 0 4px rgba(255,59,85,.3)"></div>
          <span class="pc-lbl" style="color: #ff8fa0">Timer running</span>
        </div>
        <span class="pc-num" style="font-size: 56px; line-height: 1">7:58.80</span>
        <span style="font-size: 20px; color: #a3a9cc">+0:06.46 since you paused</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column">
      <div class="pc-tr" style="height: 32px; font-size: 14px; border-bottom-color: #2d335e">
        <span class="pc-lbl">Stage</span><span class="pc-lbl" style="text-align: right">Deaths</span><span class="pc-lbl" style="text-align: right">Segment</span><span class="pc-lbl" style="text-align: right">Split</span><span class="pc-lbl" style="text-align: right">vs PB</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div class="pc-tr {{r.row}}">
          <span>{{r.name}}</span>
          <span class="pc-num">{{r.deaths}}</span>
          <span class="pc-num {{r.scls}}">{{r.seg}}</span>
          <span class="pc-num {{r.tcls}}">{{r.split}}</span>
          <span class="pc-num {{r.cls}}">{{r.delta}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span class="pc-lbl">Deaths so far · 215</span>
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 96px 1fr 48px; align-items: center; gap: 16px; font-size: 18px">
          <span style="color: #a3a9cc">{{b.name}}</span>
          <div style="height: 14px; background: #1c2142"><div style="height: 14px; width: {{b.w}}; background: {{b.c}}"></div></div>
          <span class="pc-num" style="font-size: 12px; text-align: right">{{b.n}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- right: frozen game and actions -->
  <div style="position: absolute; left: 1216px; top: 96px; width: 608px; height: 888px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
      <div style="width: 400px; height: 304px; overflow: hidden; box-shadow: 0 0 0 2px #05060d, 0 0 0 5px rgba(255,255,255,.1)">
        <div style="width: 800px; height: 608px; transform: scale(.5); transform-origin: 0 0"><dc-import name="GameScene" hint-size="800px,608px"></dc-import></div>
      </div>
      <span class="pc-lbl">Game frozen · Stage 5</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 18px">
      <button class="pc-btn sel" type="button">Continue <small>Esc</small></button>
      <button class="pc-btn" type="button">Retry from save <small>R</small></button>
      <button class="pc-btn" type="button">Restart run <small>Q</small></button>
      <button class="pc-btn" type="button">Quit <small>Hold Esc</small></button>
    </div>
    <fieldset class="pc-panel" style="margin: 0; border: 0; padding: 20px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <legend class="pc-lbl" style="float: left; width: 100%; padding: 0; margin-bottom: 4px; grid-column: 1 / -1">On-screen display</legend>
      <label class="pc-tog" for="pc-t1"><input id="pc-t1" type="checkbox" checked="checked"> Timer</label>
      <label class="pc-tog" for="pc-t2"><input id="pc-t2" type="checkbox" checked="checked"> Splits</label>
      <label class="pc-tog" for="pc-t3"><input id="pc-t3" type="checkbox" checked="checked"> Deaths</label>
      <label class="pc-tog" for="pc-t4"><input id="pc-t4" type="checkbox"> Input display</label>
    </fieldset>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ name: 'Stage 1', deaths: '21', seg: '0:58.42', scls: '', split: '0:58.42', tcls: '', delta: '−2.68', cls: 'ahead', row: '' },
{ name: 'Stage 2', deaths: '48', seg: '1:42.18', scls: '', split: '2:40.60', tcls: '', delta: '+1.10', cls: 'behind', row: '' },
{ name: 'Stage 3', deaths: '77', seg: '2:05.60', scls: 'gold', split: '4:46.20', tcls: '', delta: '−7.32', cls: 'ahead', row: '' },
{ name: 'Stage 4', deaths: '39', seg: '1:31.04', scls: '', split: '6:17.24', tcls: '', delta: '−9.78', cls: 'ahead', row: '' },
{ name: 'Stage 5', deaths: '30', seg: '1:41.56', scls: 'dim', split: '8:46.90', tcls: 'dim', delta: 'live', cls: 'dim', row: 'cur' },
{ name: 'Stage 6', deaths: '', seg: '', scls: '', split: '10:42.20', tcls: 'dim', delta: '', cls: '', row: '' },
{ name: 'Boss', deaths: '', seg: '', scls: '', split: '12:51.30', tcls: 'dim', delta: '', cls: '', row: '' }
],
bars: [
{ name: 'Stage 1', n: '21', w: '27%', c: '#a3a9cc' },
{ name: 'Stage 2', n: '48', w: '62%', c: '#a3a9cc' },
{ name: 'Stage 3', n: '77', w: '100%', c: '#ff3b55' },
{ name: 'Stage 4', n: '39', w: '51%', c: '#a3a9cc' },
{ name: 'Stage 5', n: '30', w: '39%', c: '#ff8fa0' }
]
};
}
}
</script>
</body>
</html>
