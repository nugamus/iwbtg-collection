<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game select, entry with no clears</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Empty state: an entry nobody has cleared. "No clears" replaces clear rate and average time; no PB rows anywhere. -->
<div style="width: 1920px; height: 1080px">
  <dc-import name="Main" state="empty" hint-size="1920px,1080px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
