<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause A: hold to quit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;family=Pixelify+Sans:wght@500;700&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
/* layout: the run stays behind a heavy dim; one centered column: live timer on top, three wide bars, run summary below */
.pa-btn{all:unset;box-sizing:border-box;position:relative;display:grid;grid-template-columns:48px 1fr auto;align-items:center;width:720px;height:96px;padding:0 32px;background:rgba(18,21,43,.92);color:#eef0fa;font-family:'Pixelify Sans',monospace;font-size:36px;font-weight:700;cursor:pointer;box-shadow:0 -4px 0 0 #2d335e,0 4px 0 0 #2d335e,-4px 0 0 0 #2d335e,4px 0 0 0 #2d335e;overflow:hidden}
.pa-btn:focus-visible{outline:4px solid #ffd34d;outline-offset:6px}
.pa-btn.sel{background:#ff3b55;color:#fff;box-shadow:0 -4px 0 0 #ff8fa0,0 4px 0 0 #a3122a,-4px 0 0 0 #ff8fa0,4px 0 0 0 #a3122a}
.pa-key{font-family:'Silkscreen',monospace;font-size:16px;letter-spacing:.06em;padding:6px 10px;background:rgba(0,0,0,.35);color:#eef0fa}
.pa-fill{position:absolute;left:0;top:0;bottom:0;width:62%;background:repeating-linear-gradient(90deg,#a3122a 0 12px,#8e0a1c 12px 16px)}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0c18; color: #eef0fa; font-family: 'Barlow Semi Condensed', system-ui, sans-serif">
  <div style="position: absolute; inset: 0"><dc-import name="Main" time="7:58.80" hint-size="1920px,1080px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(6,7,16,.82); backdrop-filter: blur(4px)"></div>

  <div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 14px; height: 14px; background: #ff3b55; box-shadow: 0 0 0 4px rgba(255,59,85,.3)"></div>
        <span style="font-family: 'Silkscreen', monospace; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: #ff8fa0">Ranked timer still running</span>
      </div>
      <span style="font-family: 'Press Start 2P', monospace; font-size: 88px; line-height: 1">7:58.80</span>
      <span style="font-size: 22px; color: #a3a9cc">Paused for 0:06.46. This time counts toward your run.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 28px">
      <button class="pa-btn sel" type="button">
        <svg width="18" height="28" viewBox="0 0 18 28" aria-hidden="true" style="shape-rendering: crispEdges"><rect x="0" y="0" width="6" height="28" fill="#fff"></rect><rect x="6" y="5" width="6" height="18" fill="#fff"></rect><rect x="12" y="10" width="6" height="8" fill="#fff"></rect></svg>
        <span>Continue</span><span class="pa-key">Esc</span>
      </button>
      <button class="pa-btn" type="button">
        <span></span>
        <span>Retry</span><span class="pa-key">Q restart run</span>
      </button>
      <button class="pa-btn" type="button" aria-describedby="pa-hold">
        <span class="pa-fill"></span>
        <span style="position: relative"></span>
        <span style="position: relative">Quit</span><span class="pa-key" style="position: relative">Hold Esc</span>
      </button>
    </div>

    <div id="pa-hold" style="display: flex; gap: 40px; font-size: 22px; color: #a3a9cc">
      <span>Stage 5 of 7</span>
      <span>215 deaths</span>
      <span>−9.78 vs PB at Stage 4</span>
      <span>Quit discards the run</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
