<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause box</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}

</style>
</helmet>
<!-- Drawn in game pixels (800x608 space); the screen scales it with the game. Black box, double white border, PAUSE heading, the delicious fruit as selector. No timer or deaths in the box: the HUD shows them. -->
<div style="width: 300px; box-sizing: border-box; padding: 22px 26px 24px; background: rgba(0,0,0,.94); border: 2px solid #ffffff; outline: 2px solid #ffffff; outline-offset: 3px; display: flex; flex-direction: column; gap: 18px; font-family: 'Pixelify Sans', monospace; color: #ffffff">
  <span style="font-size: 34px; font-weight: 700; letter-spacing: .18em; line-height: 1; text-align: center; padding-left: .18em">PAUSE</span>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <button class="pb-item" type="button" style="all: unset; box-sizing: border-box; height: 32px; display: flex; align-items: center; gap: 10px; cursor: pointer">
        <span style="width: 21px; height: 24px; flex: none; overflow: hidden; opacity: {{it.cherryOpacity}}">
          <img src="/_blob/2a631fa814971f261b2f85280bf1b4ef" alt="" width="42" height="24" style="display: block; image-rendering: pixelated; animation: pb-cherry 640ms steps(2) infinite">
        </span>
        <span style="font-size: 18px; font-weight: {{it.weight}}; letter-spacing: .04em; color: {{it.color}}; transform: translateX({{it.shift}}px)">{{it.label}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"int","min":0,"max":3,"default":0},"$preview":{"width":320,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = Number(this.props.selected ?? 0);
    const items = ['Continue', 'Retry from save', 'Restart run', 'Quit'].map((label, i) => ({
      label,
      cherryOpacity: i === sel ? 1 : 0,
      color: i === sel ? '#ffffff' : '#8d909e',
      weight: i === sel ? 600 : 500,
      shift: i === sel ? 4 : 0,
    }));
    return { items };
  }
}
</script>
</body>
</html>
