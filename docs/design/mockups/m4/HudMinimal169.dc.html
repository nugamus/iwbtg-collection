<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In-run HUD 16:9 minimal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;family=Pixelify+Sans:wght@500;700&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; overflow: hidden">
  <dc-import name="Main" show-splits="{{ false }}" show-deaths="{{ false }}" show-inputs="{{ false }}" hint-size="1920px,1080px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
