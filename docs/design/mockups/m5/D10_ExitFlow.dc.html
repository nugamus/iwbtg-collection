<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaving a run, both modes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- #1553: Back on results goes to game select, never back into a finished run. Both modes end where they started: Time Attack on game select with the same map picked (its panel now shows the new PB), Classic on the shelf with the same game picked. Screen changes use the m4 motion: the old screen fades 300 ms while the new one's header slides in from the left (600 ms OutQuint). -->
<div style="position: relative; width: 1920px; height: 860px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8">
  <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
    <div style="position: absolute; left: 40px; top: {{row.y}}px; display: flex; flex-direction: column; gap: 14px">
      <span style="display: flex; align-items: center; gap: 12px"><span style="width: 14px; height: 14px; border-radius: 4px; background: {{row.c}}"></span><span style="font-size: 24px; font-weight: 700">{{row.name}}</span></span>
      <div style="display: flex; align-items: center; gap: 0">
        <sc-for list="{{row.steps}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; align-items: center">
            <div style="display: flex; flex-direction: column; gap: 8px; width: 300px">
              <div style="position: relative; width: 300px; height: 169px; border-radius: 8px; overflow: hidden; box-shadow: {{s.ring}}"><div style="width: 1920px; height: 1080px; transform: scale(.15625); transform-origin: 0 0">
                <sc-if value="{{s.isSelect}}" hint-placeholder-val="{{ false }}"><dc-import name="Select" mode="ta" hint-size="1920px,1080px"></dc-import></sc-if>
                <sc-if value="{{s.isLoading}}" hint-placeholder-val="{{ false }}"><dc-import name="Loading2" mode="{{s.mode}}" hint-size="1920px,1080px"></dc-import></sc-if>
                <sc-if value="{{s.isRun}}" hint-placeholder-val="{{ false }}"><dc-import name="Notices" view="inrun" hint-size="1920px,1080px"></dc-import></sc-if>
                <sc-if value="{{s.isResults}}" hint-placeholder-val="{{ false }}"><div style="position: relative; width: 1920px; height: 1080px"><dc-import name="Backdrop" w="1920px" h="1080px" hue="250" blur="45" dim="0.62" tag="none" hint-size="1920px,1080px"></dc-import><span style="position: absolute; left: 80px; top: 120px; font-family: 'Barlow Condensed', sans-serif; font-size: 220px; font-weight: 700">38:12.46</span><span style="position: absolute; left: 90px; top: 420px; font-size: 64px; font-weight: 700; color: #c9cde0">m4 Results169, unchanged</span></div></sc-if>
                <sc-if value="{{s.isShelf}}" hint-placeholder-val="{{ false }}"><dc-import name="Shelf" hint-size="1920px,1080px"></dc-import></sc-if>
                <sc-if value="{{s.isClassicRun}}" hint-placeholder-val="{{ false }}"><dc-import name="ClassicRun" screen="title" hint-size="1920px,1080px"></dc-import></sc-if>
                <sc-if value="{{s.isSession}}" hint-placeholder-val="{{ false }}"><dc-import name="Session" hint-size="1920px,1080px"></dc-import></sc-if>
              </div></div>
              <span style="font-size: 16px; font-weight: 700">{{s.label}}</span>
              <span style="font-size: 13px; line-height: 1.4; color: #a2a8bc">{{s.note}}</span>
            </div>
            <sc-if value="{{s.arrow}}" hint-placeholder-val="{{ true }}">
              <div style="width: 66px; display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -60px"><span style="font-size: 12px; font-weight: 700; color: #c9cde0; white-space: nowrap">{{s.arrow}}</span><svg width="50" height="14" viewBox="0 0 50 14" aria-hidden="true"><path d="M2 7h44M39 2l6 5-6 5" stroke="#c9cde0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="position: relative; width: {{row.loopW}}px; height: 34px; margin-left: 150px">
        <svg width="{{row.loopW}}" height="34" viewBox="0 0 {{row.loopW}} 34" style="position: absolute; inset: 0" aria-hidden="true"><path d="{{row.loop}}" stroke="{{row.c}}" stroke-width="2.5" fill="none" stroke-linejoin="round"></path><path d="M-6 10l6-8 6 8" transform="translate(0 0)" stroke="{{row.c}}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 0 12px; background: #0b0d14; font-size: 14px; font-weight: 700; color: {{row.c}}; white-space: nowrap">{{row.loopLabel}}</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (comp, label, note, arrow, o) => Object.assign({ label, note, arrow, mode: '', ring: 'none', isSelect: comp === 'Select', isLoading: comp === 'Loading2', isRun: comp === 'Run', isResults: comp === 'Results', isShelf: comp === 'Shelf', isClassicRun: comp === 'ClassicRun', isSession: comp === 'Session' }, o || {});
    const loopW = 4 * 366 + 0;
    const loop = `M2 2 V22 H${loopW - 2} V2`;
    return { rows: [
      { name: 'Time Attack', c: '#ff3d55', y: 30, loopW, loop, loopLabel: 'Back or Esc on results · Quit in pause (no results) · Back on a script error', steps: [
        st('Select', 'Game select', 'Pick a map, mods, Enter.', 'Enter', { mode: 'ta' }),
        st('Loading2', 'Loading card', 'At least 1.5 s, starts by itself. Esc goes back.', '', { mode: 'ta' }),
        st('Run', 'The run', 'Pause: Continue, Retry, Restart, Practice this stage, Options, Quit.', 'clear', { state: 'hud' }),
        st('Results', 'Results (m4)', 'Retry (hold R) starts a new run from the card.', 'Back', { ring: '0 0 0 3px #ff3d55' }),
        st('Select', 'Game select again', 'Same map picked; its panel now shows the new PB.', '', { mode: 'ta' }),
      ] },
      { name: 'Classic', c: '#8f7bff', y: 440, loopW, loop, loopLabel: 'Back to the shelf in pause, or the game’s ending → session summary → Back', steps: [
        st('Shelf', 'Shelf', 'Pick a game, Play.', 'Play', {}),
        st('Loading2', 'Loading card', 'Where you got to last time.', '', { mode: 'classic' }),
        st('ClassicRun', 'The game, its title first', 'The game’s own menus and saves; nothing else on screen.', 'Back to shelf', { screen: 'title' }),
        st('Session', 'Session summary', 'Continue playing goes back into the game.', 'Back', { ring: '0 0 0 3px #8f7bff' }),
        st('Shelf', 'Shelf again', 'Same game picked; Your progress shows where you got to.', '', {}),
      ] },
    ] };
  }
}
</script>
</body>
</html>
