<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes cr-blink{0%,60%{opacity:1}61%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<!-- A Classic run. The game sits where the m4 HUD puts it (16:9: fills the height), with only the game's art around it: no leaderboard, no timer. The session panel (session time, deaths, stage) is off by default; Settings → Gameplay and HUD turns it on, and then it sits on the left and dims to 40% while the kid moves. Pausing opens the pause menu (D14). -->
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <div style="position: absolute; inset: 0"><dc-import name="Backdrop" w="1920px" h="1080px" hue="250" blur="60" dim="0.45" tag="none" hint-size="1920px,1080px"></dc-import></div>
  <div style="position: absolute; left: 249px; top: 0; width: 1422px; height: 1080px; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,.6)">
    <sc-if value="{{titleScreen}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0"><dc-import name="Backdrop" w="1422px" h="1080px" hue="250" scene="castle" blur="0" dim="0.2" tag="none" hint-size="1422px,1080px"></dc-import></div>
      <div style="position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 30px; font-family: 'Pixelify Sans', monospace">
        <span style="font-size: 92px; font-weight: 700; letter-spacing: .04em; color: #ffffff; text-shadow: 6px 6px 0 #3a1030">I wanna be the</span>
        <span style="font-size: 132px; font-weight: 700; letter-spacing: .04em; color: #ffd98a; text-shadow: 8px 8px 0 #3a1030; margin-top: -30px">Kaenbyou</span>
        <span style="margin-top: 120px; font-size: 40px; font-weight: 600; color: #ffffff; animation: cr-blink 1s steps(1) infinite">Press SHIFT to start</span>
      </div>
      <span style="position: absolute; right: 18px; bottom: 16px; padding: 5px 12px; border-radius: 10px; background: rgba(0,0,0,.55); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #c9cde0">Placeholder for the game's own title screen</span>
    </sc-if>
    <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
      <div style="width: 800px; height: 608px; transform: scale(1.77632); transform-origin: 0 0"><dc-import name="GameScene" hint-size="800px,608px"></dc-import></div>
    </sc-if>
  </div>

  <!-- the session panel -->
  <sc-if value="{{hud}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 22px; top: 360px; width: 206px; display: flex; flex-direction: column; gap: 16px; opacity: {{hudOp}}">
      <div style="align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 8px; background: #8f7bff; display: flex; align-items: center; transform: skewX(-11.31deg)"><span style="transform: skewX(11.31deg); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase">Classic</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a2a8bc">This session</span><span style="font-size: 30px; font-weight: 600">0:12:44</span><span style="font-size: 13px; color: #a2a8bc">16:11:56 in this game</span></div>
      <div style="display: flex; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a2a8bc">Deaths</span><span style="font-size: 22px; font-weight: 600">37</span><span style="font-size: 13px; color: #a2a8bc">1,321 total</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a2a8bc">Stage</span><span style="font-size: 22px; font-weight: 600">{{stage}}</span><span style="font-size: 13px; color: #a2a8bc">furthest 4</span></div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["title","panel"],"default":"title"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.screen ?? 'title';
    return {
      titleScreen: s === 'title', playing: s !== 'title',
      hud: s === 'panel', hudOp: 1, stage: s === 'title' ? '—' : '4',
    };
  }
}
</script>
</body>
</html>
