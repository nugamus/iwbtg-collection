<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialogs over the main menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
@keyframes md-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<!-- One dialog shape for the shell: an upright card (no shear: it holds paragraphs) with a 4 px accent line, over the screen dimmed to 62%. It scales from 0.95 and fades in 300 ms OutQuint; Esc or B is always Cancel. Buttons are the kit's sheared buttons. -->
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <dc-import name="MainMenu" state="top" user="{{user}}" hint-size="1920px,1080px"></dc-import>
  <sc-if value="{{dimmed}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: rgba(5,6,10,.62)"></div>
  </sc-if>
  <sc-if value="{{holdBar}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 56px; width: 1920px; height: 6px; background: rgba(255,255,255,.1)"><div style="width: 58%; height: 100%; background: #ff3d55"></div></div>
    <span style="position: absolute; left: 40px; top: 74px; font-size: 15px; font-weight: 600; color: #e3e5ee">Hold Esc to exit · let go to stay</span>
  </sc-if>
  <sc-if value="{{card}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: {{cx}}px; top: {{cy}}px; width: {{cw}}px; border-radius: 10px; background: #12141d; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden">
      <div style="height: 4px; background: {{line}}"></div>
      <div style="padding: 32px 38px 30px; display: flex; flex-direction: column; gap: 16px">
        <sc-if value="{{spinner}}" hint-placeholder-val="{{ false }}">
          <div style="width: 72px; height: 72px; position: relative">
            <div style="position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(255,255,255,.1); border-top-color: #ff3d55; animation: md-spin 900ms linear infinite"></div>
            <img src="/_blob/dd3504fc78d818a5c566e1ae138ad56f" alt="" width="28" height="32" style="position: absolute; left: 22px; top: 20px; image-rendering: pixelated">
          </div>
        </sc-if>
        <span style="font-size: 30px; font-weight: 700; line-height: 1.15">{{title}}</span>
        <span style="font-size: 17px; line-height: 1.55; color: #e3e5ee">{{body}}</span>
        <sc-if value="{{rows}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px; margin: 4px 0">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
              <div style="display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,.06)">
                <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="{{r.icon}}" stroke="{{r.ic}}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{r.a}}</span><span style="font-size: 14px; color: #a2a8bc">{{r.b}}</span></span>
                <span style="font-size: 15px; font-weight: 600; color: #c9cde0; white-space: nowrap">{{r.c}}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{code}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 10px; background: rgba(255,255,255,.06)">
            <span style="font-size: 14px; color: #a2a8bc">No browser here? Open <span style="font-weight: 700; color: #ffffff">[server]/device</span> on your phone and enter</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: .12em">{{code}}</span>
          </div>
        </sc-if>
        <div style="display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap">
          <sc-for list="{{buttons}}" as="b" hint-placeholder-count="2">
            <button type="button" style="all: unset; height: 54px; padding: 0 26px; border-radius: 10px; background: {{b.bg}}; display: flex; align-items: center; transform: skewX(-11.31deg); cursor: pointer; box-shadow: {{b.shadow}}; flex: {{b.flex}}"><span style="transform: skewX(11.31deg); display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; font-size: 18px; font-weight: 700; white-space: nowrap"><sc-if value="{{b.mark}}" hint-placeholder-val="{{ false }}"><span style="width: 26px; height: 26px; border-radius: 6px; background: #ffffff; color: #10121a; display: grid; place-items: center; font-size: 14px; font-weight: 700">{{b.mark}}</span></sc-if>{{b.label}}</span></button>
          </sc-for>
        </div>
        <sc-if value="{{foot}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; line-height: 1.5; color: #a2a8bc">{{foot}}</span></sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; right: 24px; top: 72px; width: 420px; border-radius: 10px; background: #12141d; box-shadow: 0 16px 40px rgba(0,0,0,.5); overflow: hidden; display: flex">
      <div style="width: 4px; background: #ffc46b"></div>
      <div style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #ffc46b">Signed out</span>
        <span style="font-size: 16px; line-height: 1.45; color: #e3e5ee">Your session ended after 30 days. Runs you clear are kept and upload once you sign in again.</span>
        <div style="display: flex; gap: 8px; margin-top: 6px">
          <button type="button" style="all: unset; height: 36px; padding: 0 16px; border-radius: 10px; background: #ff3d55; display: flex; align-items: center; transform: skewX(-11.31deg); cursor: pointer"><span style="transform: skewX(11.31deg); font-size: 15px; font-weight: 700">Sign in again</span></button>
          <button type="button" style="all: unset; height: 36px; padding: 0 16px; border-radius: 10px; background: rgba(255,255,255,.1); display: flex; align-items: center; transform: skewX(-11.31deg); cursor: pointer"><span style="transform: skewX(11.31deg); font-size: 15px; font-weight: 600">Later</span></button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["exit","update","signin","waiting","expired"],"default":"exit"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'exit';
    const pri = (label, opt) => Object.assign({ label, bg: '#ff3d55', shadow: '0 8px 24px rgba(255,61,85,.35)', flex: 'none', mark: '' }, opt || {});
    const sec = (label, opt) => Object.assign({ label, bg: 'rgba(255,255,255,.12)', shadow: 'none', flex: 'none', mark: '' }, opt || {});
    const base = { user: 'in', dimmed: true, card: true, toast: false, holdBar: false, spinner: false, rows: null, code: '', foot: '', cx: 610, cy: 300, cw: 700, line: '#ff3d55' };
    const dl = 'M10 3v10M6 9.5l4 4 4-4M4 17h12', up = 'M10 17V7M6 10.5l4-4 4 4M4 3h12';
    if (kind === 'exit') return Object.assign(base, {
      title: 'Exit IWBTG Collection?', body: 'Two things are still running. Both pick up where they stopped next time.',
      rows: [{ icon: dl, ic: '#c9cde0', a: 'Downloading I wanna be the Machinary', b: 'resumes on the next start', c: '64% · 12.4 / 19.3 MB' }, { icon: up, ic: '#c9cde0', a: '1 clear waits to upload', b: 'I wanna be the Kaenbyou · Very Hard · 38:12.46', c: 'when online' }],
      buttons: [pri('Exit'), sec('Cancel')], holdBar: false, foot: 'With nothing running, Exit closes at once. Holding Esc on the main menu for 1 s also exits (the bar under the toolbar fills); letting go cancels.',
    });
    if (kind === 'update') return Object.assign(base, {
      title: 'Version 0.9.0 is ready', body: 'It downloaded in the background (38 MB). Restart now, or it installs the next time you start.',
      rows: [{ icon: 'M4 10h12M10 4v12', ic: '#45d483', a: 'New: the Classic shelf', b: 'changelog line, sample', c: '' }, { icon: 'M5 10l3 3 7-7', ic: '#45d483', a: 'Fixed: replays of skipped cutscenes', b: 'changelog line, sample', c: '' }, { icon: 'M10 4v7M10 14.5v.5', ic: '#ffc46b', a: 'Engine build changes', b: 'Your records re-verify on the server; none are lost (product.md, Leaderboards).', c: '' }],
      buttons: [pri('Restart and update'), sec('Later'), sec('What’s new', { bg: 'rgba(255,255,255,.06)' })], foot: 'Never mid-run: the prompt waits until you are back on a menu.', cy: 260,
    });
    if (kind === 'signin') return Object.assign(base, {
      user: 'out', title: 'Sign in', body: 'An account puts your clears on the global leaderboards, gives you a public profile and lets others race your ghost. Playing never needs one.',
      buttons: [sec('Continue with Google', { flex: '1', mark: 'G', bg: 'rgba(255,255,255,.14)' }), sec('Continue with Discord', { flex: '1', mark: 'D', bg: 'rgba(255,255,255,.14)' })],
      foot: 'Your browser opens to finish; the client never sees your password (#159). The first sign-in picks your player name, checked against the name rules. Provider buttons follow each provider’s own branding rules when built; plain marks here.',
      cy: 300, cw: 720,
    });
    if (kind === 'waiting') return Object.assign(base, {
      user: 'out', spinner: true, title: 'Finish signing in in your browser', body: 'We opened Discord’s sign-in page in your browser. Come back here when it says you are done; this closes by itself.',
      code: 'WQ7-KD4', buttons: [sec('Open the page again'), sec('Cancel', { bg: 'rgba(255,255,255,.06)' })], foot: 'Waiting for the browser… · stops after 10 minutes', cy: 250,
    });
    return Object.assign(base, { user: 'expired', dimmed: false, card: false, toast: true, title: '', body: '', buttons: [] });
  }
}
</script>
</body>
</html>
