<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Racing your PB ghost</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
@keyframes gh-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<!-- #64: a ghost run in the room with you, picked on the mod sheet (Ghost: Your PB or Board #1, D9). The ghost is the replay's kid, drawn white at 45% with a short fading trail, and a small tag says whose it is. It is drawn only: no collision, no sound, and it never changes the run, so the run stays ranked. The ghost lives in its own room: when it is in another room, the tag at the game's edge says where (Stage 5-4, ahead) instead. The left column swaps its top rows for the ghost card, which shows the gap at the last room change in green or red with its sign. On a room change the gap line updates and flashes 300 ms; the card slides in 400 ms OutQuint when the run starts. -->
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <div style="position: absolute; inset: 0"><dc-import name="Backdrop" w="1920px" h="1080px" hue="250" blur="60" dim="0.45" tag="bottom-left" label="I wanna be the Kaenbyou" hint-size="1920px,1080px"></dc-import></div>
  <div style="position: absolute; left: 249px; top: 0; width: 1422px; height: 1080px; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,.6)">
    <div style="width: 800px; height: 608px; transform: scale(1.77632); transform-origin: 0 0; position: relative">
      <dc-import name="GameScene" hint-size="800px,608px"></dc-import>
      <svg viewBox="0 0 800 608" width="800" height="608" style="position: absolute; left: 0; top: 0; shape-rendering: crispEdges" aria-hidden="true">
        <g opacity=".14"><rect x="372" y="330" width="22" height="22" fill="#ffffff"></rect></g>
        <g opacity=".22"><rect x="392" y="312" width="22" height="22" fill="#ffffff"></rect></g>
        <g opacity=".3"><rect x="412" y="298" width="22" height="22" fill="#ffffff"></rect></g>
        <g transform="translate(430,288)" opacity=".55"><rect x="2" y="9" width="6" height="10" fill="#ffffff"></rect><rect x="6" y="0" width="12" height="5" fill="#ffffff"></rect><rect x="7" y="4" width="10" height="7" fill="#ffffff"></rect><rect x="14" y="6" width="2" height="2" fill="#6a7088"></rect><rect x="7" y="11" width="10" height="7" fill="#ffffff"></rect><rect x="16" y="13" width="7" height="2" fill="#ffffff"></rect><rect x="8" y="18" width="3" height="4" fill="#ffffff"></rect><rect x="14" y="17" width="3" height="4" fill="#ffffff"></rect></g>
      </svg>
    </div>
    <div style="position: absolute; left: 726px; top: 452px; height: 26px; padding: 0 10px; border-radius: 8px; background: rgba(8,9,14,.75); display: flex; align-items: center; gap: 6px; transform: skewX(-11.31deg)"><span style="transform: skewX(11.31deg); font-size: 13px; font-weight: 700; white-space: nowrap">Your PB</span></div>
  </div>

  <!-- left column: the ghost card over the leaderboard -->
  <div style="position: absolute; left: 18px; top: 150px; width: 214px; display: flex; flex-direction: column; gap: 12px; animation: gh-in 400ms cubic-bezier(.23,1,.32,1) both">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #a2a8bc">Ghost</span>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 9px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700">PB</span>
      <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 16px; font-weight: 700">Your PB</span><span style="font-size: 13px; color: #a2a8bc">37:48.62 · 12 Nov</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #c9cde0">At the last room change</span>
      <span style="font-size: 34px; font-weight: 600; line-height: 1.05; color: #45d483">−0.84</span>
      <span style="font-size: 13px; color: #a2a8bc">you entered 5-3 first</span>
    </div>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{rooms}}" as="r" hint-placeholder-count="5"><span style="flex: 1; height: 22px; border-radius: 6px; background: {{r.bg}}; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: {{r.ink}}">{{r.s}}</span></sc-for>
    </div>
    <span style="font-size: 12px; color: #a2a8bc">last five rooms against the ghost</span>
  </div>
  <div style="position: absolute; left: 0; top: 520px"><dc-import name="Leaderboard" scenario="p25" density="full" width="232" rows="5" hint-size="232px,300px"></dc-import></div>

  <div style="position: absolute; left: 1694px; top: 300px"><dc-import name="RunInfo" mode="mods" time="38:02.56" width="206" hint-size="206px,420px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { rooms: ['−', '+', '−', '−', '−'].map((x) => ({ s: x, bg: x === '−' ? 'rgba(69,212,131,.22)' : 'rgba(255,107,107,.22)', ink: x === '−' ? '#45d483' : '#ff6b6b' })) };
  }
}
</script>
</body>
</html>
