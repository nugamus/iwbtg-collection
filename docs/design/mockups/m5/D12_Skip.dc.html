<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skip cutscene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Skip (skip.md, #573), Time Attack only. While a skippable scene or dialogue plays, a hint sits at the bottom edge of the game (fades in 300 ms after the scene starts, out when it ends) and the timer shows it is frozen: the digits turn soft grey with a pause mark and "cutscene". One press runs the scene out at once (up to 60 s of game time). -->
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <div style="position: absolute; inset: 0"><dc-import name="Backdrop" w="1920px" h="1080px" hue="250" blur="60" dim="0.45" tag="none" hint-size="1920px,1080px"></dc-import></div>
  <div style="position: absolute; left: 249px; top: 0; width: 1422px; height: 1080px; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,.6)">
    <div style="width: 800px; height: 608px; transform: scale(1.77632); transform-origin: 0 0"><dc-import name="GameScene" hint-size="800px,608px"></dc-import></div>
    <div style="position: absolute; left: 160px; right: 160px; top: 640px; padding: 26px 34px; background: rgba(0,0,0,.88); border: 4px solid #ffffff; font-family: 'Pixelify Sans', monospace; font-size: 38px; line-height: 1.4; color: #ffffff">[the game's own dialogue box, in game pixels]</div>
    <div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center">
      <div style="height: 46px; padding: 0 20px 0 8px; border-radius: 10px; background: rgba(8,9,14,.84); display: flex; align-items: center; gap: 12px; transform: skewX(-11.31deg); box-shadow: 0 8px 24px rgba(0,0,0,.5)">
        <span style="transform: skewX(11.31deg); display: flex; align-items: center; gap: 12px"><span style="min-width: 30px; height: 30px; padding: 0 9px; border-radius: 6px; background: rgba(255,255,255,.88); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); color: #10121a; display: grid; place-items: center; font-size: 13px; font-weight: 700">Backspace</span><span style="font-size: 17px; font-weight: 700">Skip cutscene</span><span style="font-size: 14px; color: #a2a8bc">timer frozen</span></span>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; top: 352px"><dc-import name="Leaderboard" scenario="p25" density="full" width="232" rows="7" hint-size="232px,360px"></dc-import></div>
  <div style="position: absolute; left: 1694px; top: 300px"><dc-import name="RunInfo" mode="ranked" frozen="{{ true }}" time="38:02.56" width="206" hint-size="206px,420px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
