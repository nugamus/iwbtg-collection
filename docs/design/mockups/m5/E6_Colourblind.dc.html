<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colourblind check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- #106: every colour that carries meaning, seen with the three common colour vision deficiencies (Machado et al. 2009 matrices at full severity, as SVG filters). Where two colours collapse, a second cue already separates them: signs on deltas (− ahead, + behind), the star on gold segments, the word in every pill, the underline position in the mode switch. -->
<div style="position: relative; width: 1920px; height: 900px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="cb-prot"><feColorMatrix type="matrix" values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"></feColorMatrix></filter>
    <filter id="cb-deut"><feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"></feColorMatrix></filter>
    <filter id="cb-trit"><feColorMatrix type="matrix" values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.303900 0 0  0 0 0 1 0"></feColorMatrix></filter>
  </svg>
  <div style="position: absolute; left: 40px; top: 30px; display: grid; grid-template-columns: repeat(4, 446px); gap: 20px">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 18px; font-weight: 700">{{v.name}}</span>
        <div style="padding: 20px; border-radius: 10px; background: #10121a; display: flex; flex-direction: column; gap: 14px; filter: {{v.filter}}">
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{pills}}" as="p" hint-placeholder-count="6">
              <span style="height: 26px; padding: 0 10px; border-radius: 9px; background: {{p.bg}}; display: flex; align-items: center; transform: skewX(-11.31deg); box-shadow: {{p.ring}}"><span style="transform: skewX(11.31deg); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: {{p.ink}}">{{p.t}}</span></span>
            </sc-for>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{splits}}" as="s" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: 70px 1fr 90px; gap: 10px; align-items: center; height: 30px; padding: 0 10px; border-radius: 7px; background: rgba(255,255,255,.04)"><span style="font-size: 14px; color: #c9cde0">{{s.n}}</span><span style="font-size: 15px; font-weight: 600; color: {{s.segInk}}">{{s.seg}}</span><span style="font-size: 15px; font-weight: 700; text-align: right; color: {{s.c}}">{{s.d}}</span></div>
            </sc-for>
          </div>
          <div style="display: flex; gap: 4px; height: 18px"><sc-for list="{{ramp}}" as="r" hint-placeholder-count="8"><span style="flex: 1; border-radius: 3px; background: {{r}}"></span></sc-for></div>
          <div style="display: flex; gap: 6px">
            <span style="flex: 1; height: 40px; border-radius: 9px; background: #ff3d55; display: grid; place-items: center; transform: skewX(-11.31deg); font-size: 14px; font-weight: 700">Time Attack</span>
            <span style="flex: 1; height: 40px; border-radius: 9px; background: #8f7bff; display: grid; place-items: center; transform: skewX(-11.31deg); font-size: 14px; font-weight: 700">Classic</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 40px; top: 560px; width: 1840px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">{{n.h}}</span><span style="font-size: 15px; line-height: 1.5; color: #c9cde0">{{n.b}}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      views: [['Normal vision', 'none'], ['Protanopia', 'url(#cb-prot)'], ['Deuteranopia', 'url(#cb-deut)'], ['Tritanopia', 'url(#cb-trit)']].map(([name, filter]) => ({ name, filter })),
      pills: [['Ranked', '#8ecbff', '#0b1a2a', 'none'], ['Loved', '#ff8fc7', '#2a0b1c', 'none'], ['Beta', 'rgba(10,12,18,.6)', '#f3f4f8', 'inset 0 0 0 1.5px rgba(255,255,255,.7)'], ['Unranked', '#ffc46b', '#2a1d05', 'none'], ['New PB', '#ff3d55', '#ffffff', 'none'], ['Classic', '#8f7bff', '#ffffff', 'none']].map(([t, bg, ink, ring]) => ({ t, bg, ink, ring })),
      splits: [['Stage 1', '★ 3:12.40', '#ffc93c', '−0:21.60', '#45d483'], ['Stage 2', '4:31.32', '#f3f4f8', '+0:33.04', '#ff6b6b'], ['Stage 3', '★ 5:50.16', '#ffc93c', '−0:12.40', '#45d483'], ['Stage 4', '5:38.48', '#f3f4f8', '+0:47.12', '#ff6b6b']].map(([n, seg, segInk, d, c]) => ({ n, seg, segInk, d, c })),
      ramp: ['#7fc8ff', '#6fe0c0', '#a9e266', '#f2d55a', '#ff9f55', '#ff6070', '#d457ad', '#9a6cf5'],
      notes: [
        { h: 'Ahead and behind', b: 'Green and red merge for protan and deutan viewers. The − and + signs already carry the meaning (m4); keep them on every delta, including the pace flash.' },
        { h: 'Time Attack and Classic', b: 'Red and violet stay apart in all three views (violet keeps its blue). The mode switch also moves its underline and the label is always written, so the tint is only a reminder.' },
        { h: 'Star ramp and status pills', b: 'Neighbouring stars blur under tritanopia; the star number is always printed in the pill. Status pills are told apart by their word; Beta is an outline so it never depends on hue.' },
      ],
    };
  }
}
</script>
</body>
</html>
