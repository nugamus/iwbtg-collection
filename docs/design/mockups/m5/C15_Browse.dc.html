<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse the catalog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Browse (#50), osu!'s beatmap listing in our look: every game in the catalog as a card with its key art, status and size, and one button that becomes the progress bar while it downloads. Installed games say so and go straight to play; a game on the signed removal list (#808, #68) is greyed, says why, and is deleted from the library on the next start. Cards appear 30 ms apart with a 300 ms fade and 12 px rise (OutQuint). -->
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <div style="position: absolute; inset: 0"><dc-import name="Backdrop" w="1920px" h="1080px" hue="210" scene="sea" blur="60" dim="0.66" tag="none" hint-size="1920px,1080px"></dc-import></div>
  <div style="position: absolute; left: 0; top: 0"><dc-import name="Toolbar" w="1920" mode="none" crumb="Browse" badge="1" hint-size="1920px,56px"></dc-import></div>
  <div style="position: absolute; left: 80px; right: 80px; top: 84px; display: flex; align-items: center; gap: 12px">
    <label for="br-search" style="width: 520px; height: 50px; border-radius: 10px; background: rgba(12,14,22,.8); display: flex; align-items: center; transform: skewX(-11.31deg)">
      <span style="transform: skewX(11.31deg); display: flex; align-items: center; gap: 12px; padding: 0 18px; width: 100%"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" stroke="#a2a8bc" stroke-width="2" fill="none"></circle><path d="M12 12l4.5 4.5" stroke="#a2a8bc" stroke-width="2" stroke-linecap="round"></path></svg><input id="br-search" type="search" placeholder="Search the catalog: title, creator, tag" style="all: unset; flex: 1; font-size: 16px; color: #f3f4f8"></span>
    </label>
    <sc-for list="{{filters}}" as="c" hint-placeholder-count="6">
      <button type="button" style="all: unset; height: 36px; padding: 0 14px; border-radius: 10px; background: {{c.bg}}; display: flex; align-items: center; transform: skewX(-11.31deg); cursor: pointer"><span style="transform: skewX(11.31deg); display: flex; gap: 6px; font-size: 14px; white-space: nowrap"><span style="color: #a2a8bc">{{c.k}}</span><span style="font-weight: 600">{{c.v}}</span></span></button>
    </sc-for>
    <span style="flex: 1"></span>
    <span style="font-size: 15px; color: #c9cde0">20 games · 6 installed · 1.4 GB free here</span>
  </div>
  <div style="position: absolute; left: 80px; right: 80px; top: 164px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 26px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="9">
      <div style="position: relative; height: 236px; border-radius: 10px; overflow: hidden; background: #10121a; box-shadow: 0 12px 30px rgba(0,0,0,.35); opacity: {{c.op}}; filter: {{c.filter}}">
        <div style="position: relative; height: 128px"><dc-import name="Backdrop" w="560px" h="128px" hue="{{c.hue}}" scene="{{c.scene}}" blur="0" dim="0.1" tag="none" hint-size="560px,128px"></dc-import>
          <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(16,18,26,1) 0%, rgba(16,18,26,0) 70%)"></div>
          <div style="position: absolute; left: 16px; top: 14px; height: 22px; padding: 0 9px; border-radius: 8px; background: {{c.stBg}}; display: flex; align-items: center; transform: skewX(-11.31deg); box-shadow: {{c.stRing}}"><span style="transform: skewX(11.31deg); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: {{c.stInk}}">{{c.status}}</span></div>
        </div>
        <div style="padding: 0 20px; margin-top: -20px; position: relative; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
          <span style="font-size: 14px; color: #a2a8bc; white-space: nowrap">{{c.meta}}</span>
        </div>
        <div style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; align-items: center; gap: 12px">
          <span style="font-size: 13px; color: {{c.noteInk}}; flex: 1; min-width: 0">{{c.note}}</span>
          <sc-if value="{{c.progress}}" hint-placeholder-val="{{ false }}">
            <span style="position: relative; width: 200px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.1); overflow: hidden; transform: skewX(-11.31deg)"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{c.pct}}%; background: rgba(255,61,85,.65)"></span><span style="position: absolute; inset: 0; transform: skewX(11.31deg); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{c.btn}}</span></span>
          </sc-if>
          <sc-if value="{{c.plain}}" hint-placeholder-val="{{ true }}">
            <span style="height: 40px; padding: 0 18px; border-radius: 10px; background: {{c.btnBg}}; display: flex; align-items: center; transform: skewX(-11.31deg)"><span style="transform: skewX(11.31deg); font-size: 15px; font-weight: 700; color: {{c.btnInk}}; white-space: nowrap">{{c.btn}}</span></span>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 80px; right: 80px; bottom: 24px; display: flex; align-items: center; gap: 14px">
    <button type="button" style="all: unset; height: 52px; padding: 0 26px; border-radius: 10px; background: rgba(255,255,255,.12); display: flex; align-items: center; transform: skewX(-11.31deg); cursor: pointer"><span style="transform: skewX(11.31deg); font-size: 17px; font-weight: 600">Back</span></button>
    <span style="flex: 1"></span>
    <span style="font-size: 14px; color: #a2a8bc">Downloads resume after a restart and are checked against their hash before they install.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const ST = { Ranked: ['#8ecbff', '#0b1a2a', 'none'], Loved: ['#ff8fc7', '#2a0b1c', 'none'], Beta: ['rgba(10,12,18,.6)', '#f3f4f8', 'inset 0 0 0 1.5px rgba(255,255,255,.7)'], Unranked: ['#ffc46b', '#2a1d05', 'none'], Removed: ['rgba(255,255,255,.12)', '#c9cde0', 'none'] };
    const C = [
      ['I wanna be the Machinary', 'メガビリー · 19.3 MB · 3 maps', 190, 'cave', 'Beta', 'downloading', 'Resumed · 2.1 MB/s', 64],
      ['I wanna be the Kaenbyou', 'Kira☆~Kira☆~ · 9.8 MB · 5 maps', 250, 'castle', 'Ranked', 'installed', 'Installed · played 2 days ago'],
      ['I wanna be the Animus', '[creator] · 14.0 MB · 2 maps', 280, 'castle', 'Ranked', 'get', 'Needle, Adventure'],
      ['I wanna eat the New Year!', '[creator] · 6.2 MB · 1 map', 20, 'city', 'Loved', 'get', 'Avoidance'],
      ['I wanna go the Spook House', 'Sephalos, Patrickgh3 · 22.1 MB · 2 maps', 20, 'sea', 'Ranked', 'update', 'Port 1.2 · 1.3 MB · your PBs stay'],
      ['I wanna be the Showdown', '[creator] · 11.5 MB · 4 maps', 330, 'city', 'Ranked', 'queued', 'Queued · after Machinary'],
      ['I wanna get the Rainbow feather', '[creator] · 8.0 MB · 1 map', 95, 'forest', 'Beta', 'get', 'Adventure, Gimmick'],
      ['[a removed game]', 'removed at the creator\'s request · 12 Nov', 0, 'cave', 'Removed', 'removed', 'Deleted from your library on the next start'],
      ['I Wanna Rely The Needle 4.2', 'NineightA · 4.4 MB · 1 map', 330, 'city', 'Unranked', 'installed', 'Installed · no leaderboard yet'],
    ];
    const cards = C.map(([title, meta, hue, scene, status, state, note, pct]) => {
      const s = ST[status];
      const b = {
        downloading: ['64% · 12.4 MB', 'rgba(255,255,255,.1)', '#ffffff'], installed: ['Play', 'rgba(255,255,255,.14)', '#ffffff'], get: ['Download', '#ff3d55', '#ffffff'],
        update: ['Update', '#ffc46b', '#2a1d05'], queued: ['Cancel', 'rgba(255,255,255,.08)', '#c9cde0'], removed: ['Removed', 'rgba(255,255,255,.06)', '#a2a8bc'],
      }[state];
      return { title, meta, hue, scene, status, stBg: s[0], stInk: s[1], stRing: s[2], note, noteInk: state === 'removed' ? '#ffc46b' : '#a2a8bc', pct: pct || 0, progress: state === 'downloading', plain: state !== 'downloading', btn: b[0], btnBg: b[1], btnInk: b[2], op: state === 'removed' ? 0.75 : 1, filter: state === 'removed' ? 'grayscale(1)' : 'none' };
    });
    return {
      cards,
      filters: [{ k: 'Status', v: 'Any ▾', bg: 'rgba(12,14,22,.8)' }, { k: 'Tags', v: 'Any ▾', bg: 'rgba(12,14,22,.8)' }, { k: '', v: 'Not installed', bg: 'rgba(255,255,255,.2)' }, { k: 'Sort', v: 'Newest ports ▾', bg: 'rgba(12,14,22,.8)' }],
    };
  }
}
</script>
</body>
</html>
