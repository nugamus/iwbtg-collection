<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fallback title and menus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- #100: a port that does not carry its own title, file select or difficulty select gets these, drawn by the client inside the game's 800x608 rectangle (scaled with the game like the PAUSE box). They use our type and shear, not pixel type, so nobody mistakes them for the original's; the package's key art and its cherry sprite make them the game's own. Input is the game's: Jump picks, Shoot goes back, as fangame menus do. -->
<div style="position: relative; width: 1920px; height: 640px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <div style="position: absolute; left: 64px; top: 40px; right: 64px; display: flex; gap: 48px">
    <sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 18px; font-weight: 700">{{f.name}}</span>
        <div style="position: relative; width: 560px; height: 426px; overflow: hidden; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,.5)">
          <dc-import name="Backdrop" w="560px" h="426px" hue="300" scene="city" blur="{{f.blur}}" dim="{{f.dim}}" tag="none" hint-size="560px,426px"></dc-import>
          <sc-if value="{{f.title}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
              <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 700; font-style: italic; line-height: .92; text-shadow: 0 4px 20px rgba(0,0,0,.7)">I wanna help<br>the Fairy tale</span>
              <span style="font-size: 15px; color: #e3e5ee; text-shadow: 0 1px 6px rgba(0,0,0,.8)">by れおちゅー</span>
              <span style="margin-top: 60px; height: 34px; padding: 0 18px; border-radius: 10px; background: rgba(8,9,14,.72); display: flex; align-items: center; transform: skewX(-11.31deg)"><span style="transform: skewX(11.31deg); font-size: 16px; font-weight: 700">Press Jump to start</span></span>
            </div>
          </sc-if>
          <sc-if value="{{f.files}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 52px; right: 52px; top: 56px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; font-style: italic">Select a file</span>
              <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
                <div style="display: flex; align-items: center; gap: 10px">
                  <span style="width: 21px; height: 24px; opacity: {{s.op}}"><img src="/_blob/dd3504fc78d818a5c566e1ae138ad56f" alt="" width="21" height="24" style="image-rendering: pixelated"></span>
                  <div style="flex: 1; height: 70px; border-radius: 10px; background: {{s.bg}}; transform: skewX(-11.31deg); box-shadow: {{s.ring}}">
                    <div style="transform: skewX(11.31deg); height: 100%; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 18px">
                      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; font-style: italic; color: {{s.ink}}">{{s.n}}</span>
                      <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">{{s.a}}</span><span style="font-size: 13px; color: #c9cde0">{{s.b}}</span></span>
                      <span style="font-size: 15px; font-weight: 600; color: #e3e5ee">{{s.c}}</span>
                    </div>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{f.diff}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 52px; right: 52px; top: 56px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; font-style: italic">Difficulty</span>
              <sc-for list="{{diffs}}" as="d" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; gap: 10px">
                  <span style="width: 21px; height: 24px; opacity: {{d.op}}"><img src="/_blob/dd3504fc78d818a5c566e1ae138ad56f" alt="" width="21" height="24" style="image-rendering: pixelated"></span>
                  <div style="flex: 1; height: 50px; border-radius: 10px; background: {{d.bg}}; transform: skewX(-11.31deg)">
                    <div style="transform: skewX(11.31deg); height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 18px"><span style="font-size: 19px; font-weight: {{d.w}}">{{d.name}}</span><span style="font-size: 13px; color: #c9cde0">{{d.note}}</span></div>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <span style="width: 560px; font-size: 15px; line-height: 1.5; color: #c9cde0">{{f.text}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { name: 'Title', title: true, blur: 0, dim: 0.15, text: 'The package’s key art, its title and creator. Any key the game reads as Jump starts; Esc is still the client’s pause.' },
        { name: 'File select', files: true, blur: 12, dim: 0.45, text: 'The same three slots the shelf shows, so picking a slot on the shelf skips this screen. The game’s cherry sprite is the selector, as in the PAUSE box.' },
        { name: 'Difficulty select', diff: true, blur: 12, dim: 0.45, text: 'Only for a new game, listing the difficulties the package declares (its maps). Notes come from the package; none are invented.' },
      ],
      slots: [['1', 'Stage 2 · Garden', '41:07 · 212 deaths', 'Normal'], ['2', 'Empty', 'New game', ''], ['3', 'Empty', 'New game', '']].map((s, i) => ({ n: s[0], a: s[1], b: s[2], c: s[3], op: i === 0 ? 1 : 0, bg: i === 0 ? 'rgba(143,123,255,.4)' : 'rgba(8,9,14,.7)', ring: i === 0 ? 'inset 0 0 0 2px #b9adff' : 'none', ink: i === 0 ? '#ffffff' : '#a2a8bc' })),
      diffs: [['Medium', 'save points everywhere'], ['Hard', ''], ['Very Hard', ''], ['Impossible', 'no save points']].map(([name, note], i) => ({ name, note, op: i === 1 ? 1 : 0, w: i === 1 ? 700 : 500, bg: i === 1 ? 'rgba(143,123,255,.4)' : 'rgba(8,9,14,.7)' })),
    };
  }
}
</script>
</body>
</html>
