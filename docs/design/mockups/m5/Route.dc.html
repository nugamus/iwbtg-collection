<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route line: progress at any game length</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;display=swap">
<style>
body{margin:0}
@keyframes rt-now{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<!-- One drawing for progress in every game, from a one-screen needle game to a 40-stage adventure. A game is a route: the package's sections (stages, chapters, bosses: whatever the porter declares) laid end to end on one line of fixed width, each as long as its share of a typical clear, so a short boss is short and a long stage is long. Up to 12 sections each get a sheared block and a label. Past 12 they become thin ticks, and only landmarks (chapters, bosses: declared by the package) get a label and a pip, so 48 sections still read at a glance. A game with no sections gets no line, only words (furthest room, save points touched). Three readings of the same line: progress (Classic: how far you got), splits (Time Attack: ahead or behind, signed), deaths (where they went, as heat). The fill grows 600 ms OutQuint; the current section pulses. -->
<div style="position: relative; width: {{w}}px; height: {{h}}px; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <sc-if value="{{head}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #a2a8bc; white-space: nowrap">{{label}}</span>
      <span style="font-size: 14px; color: #c9cde0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{summary}}</span>
    </div>
  </sc-if>
  <sc-if value="{{hasLine}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 6px; right: 6px; top: {{lineY}}px; height: {{lineH}}px">
      <sc-if value="{{blocks}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="7">
          <span style="position: absolute; top: 0; height: {{lineH}}px; left: {{s.x}}px; width: {{s.bw}}px; border-radius: 6px; background: {{s.bg}}; transform: skewX(-11.31deg); box-shadow: {{s.ring}}; animation: {{s.anim}}"></span>
        </sc-for>
      </sc-if>
      <sc-if value="{{thin}}" hint-placeholder-val="{{ false }}">
        <span style="position: absolute; left: 0; right: 0; top: 0; height: {{lineH}}px; border-radius: 5px; background: rgba(255,255,255,.08); transform: skewX(-11.31deg); overflow: hidden">
          <sc-for list="{{segs}}" as="s" hint-placeholder-count="40"><span style="position: absolute; top: 0; bottom: 0; left: {{s.x}}px; width: {{s.w}}px; background: {{s.bg}}; animation: {{s.anim}}"></span></sc-for>
        </span>
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="40"><span style="position: absolute; top: -3px; height: {{t.h}}px; left: {{t.x}}px; width: 1px; background: rgba(11,13,20,.85)"></span></sc-for>
      </sc-if>
      <sc-for list="{{pips}}" as="p" hint-placeholder-count="6">
        <span style="position: absolute; top: {{p.y}}px; left: {{p.x}}px; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 3px; background: {{p.c}}; box-shadow: 0 0 0 2px #0b0d14"></span>
      </sc-for>
    </div>
    <sc-for list="{{labels}}" as="l" hint-placeholder-count="7">
      <span style="position: absolute; top: {{labelY}}px; left: {{l.x}}px; transform: translateX({{l.tx}}); display: flex; flex-direction: column; align-items: {{l.al}}; gap: 1px; white-space: nowrap">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: {{l.size}}px; font-weight: 700; color: {{l.ink}}">{{l.name}}</span>
        <span style="font-size: 12px; font-weight: 600; color: {{l.dc}}">{{l.d}}</span>
      </span>
    </sc-for>
  </sc-if>
  <sc-if value="{{noLine}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: {{lineY}}px; display: flex; gap: 34px">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">{{f.v}}</span><span style="font-size: 12px; color: #a2a8bc">{{f.k}}</span></div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"len":{"editor":"enum","options":["short","standard","long","none"],"default":"standard"},"variant":{"editor":"enum","options":["progress","splits","deaths"],"default":"progress"},"mode":{"editor":"enum","options":["ta","classic"],"default":"classic"},"w":{"editor":"int","min":240,"max":1400,"default":640},"head":{"editor":"boolean","default":true},"at":{"editor":"int","min":-1,"max":47,"default":-1},"$preview":{"width":640,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const len = this.props.len ?? 'standard';
    const variant = this.props.variant ?? 'progress';
    const classic = (this.props.mode ?? 'classic') === 'classic';
    const head = !(this.props.head === false || this.props.head === 'false');
    const w = Number(this.props.w ?? 640);
    const accent = classic ? '#8f7bff' : '#ff3d55';
    const accentSoft = classic ? 'rgba(143,123,255,.45)' : 'rgba(255,61,85,.4)';
    // sections: [name, weight, landmark, delta (s, splits), deaths]
    let S, reached, cur;
    if (len === 'short') {
      S = [['Part 1', 1.2, false, -1.8, 41], ['Part 2', 1.6, false, 2.4, 97], ['Lemon', 0.7, true, 0, 30]];
      reached = 2; cur = 2;
    } else if (len === 'standard') {
      S = [['1', 1, false, -21.6, 380], ['2', 1.3, false, 33.0, 611], ['3', 1.1, false, -12.4, 1040], ['4', 1.4, false, 47.1, 1520], ['5', 1.6, false, -8.2, 902], ['6', 1.4, false, -6.9, 611], ['Boss', 0.8, true, -7.16, 130]];
      reached = classic ? 6 : 4; cur = classic ? 6 : 4;
    } else if (len === 'long') {
      S = [];
      const names = ['Forest', 'Ruins', 'Clock tower', 'Ice cave', 'Sky', 'Final'];
      for (let c = 0; c < 6; c++) for (let k = 0; k < 8; k++) {
        const boss = k === 7;
        S.push([boss ? names[c] : (c + 1) + '-' + (k + 1), boss ? 0.7 : 0.8 + ((c * 7 + k * 3) % 5) * 0.15, boss, boss ? [-14.2, 21.9, -3.1, 8.8, 0, 0][c] : 0, 20 + ((c * 13 + k * 29) % 70) + (k === 4 && c === 2 ? 260 : 0)]);
      }
      reached = 27; cur = 27;
    } else {
      S = []; reached = 0; cur = 0;
    }
    const at = Number(this.props.at ?? -1);
    const finished = at < 0 && classic && len === 'standard';
    if (at >= 0) { reached = at; cur = at; }
    const n = S.length;
    const innerW = w - 12;
    const total = S.reduce((a, s) => a + s[1], 0) || 1;
    const blocks = n > 0 && n <= 12, thin = n > 12;
    const gap = blocks ? 8 : 0;
    const usable = innerW - gap * Math.max(0, n - 1);
    let x = 0;
    const maxD = Math.max(1, ...S.map((s) => s[4]));
    const fmt = (v) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1);
    const segs = [], labels = [], pips = [], ticks = [];
    S.forEach((s, i) => {
      const sw = usable * s[1] / total;
      const done = i < reached || (finished && i <= reached), now = i === cur && !finished;
      let bg;
      if (variant === 'deaths') {
        const a = 0.12 + 0.88 * (s[4] / maxD);
        bg = `rgba(${classic ? '143,123,255' : '255,61,85'},${a.toFixed(2)})`;
      } else if (variant === 'splits') {
        bg = done ? (s[3] < 0 ? 'rgba(69,212,131,.55)' : s[3] > 0 ? 'rgba(255,107,107,.55)' : 'rgba(255,255,255,.3)') : now ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.08)';
      } else {
        bg = done ? (s[2] ? accent : accentSoft) : now ? accent : 'rgba(255,255,255,.08)';
      }
      segs.push({ x: Math.round(x), w: Math.max(1, Math.round(sw)), bw: Math.max(4, Math.round(sw)), bg, ring: s[2] && blocks ? 'inset 0 0 0 2px rgba(255,255,255,.55)' : 'none', anim: now && variant !== 'deaths' ? 'rt-now 1.2s ease-in-out infinite' : 'none' });
      const mid = 6 + x + sw / 2;
      if (thin && i > 0) ticks.push({ x: Math.round(x), h: S[i - 1][2] ? 0 : 16 });
      if (blocks || s[2]) {
        let d = '', dc = '#a2a8bc';
        if (variant === 'splits' && done && s[3] !== 0) { d = fmt(s[3]); dc = s[3] < 0 ? '#45d483' : '#ff6b6b'; }
        else if (variant === 'splits' && now) { d = 'now'; dc = '#ffffff'; }
        else if (variant === 'deaths') { d = String(s[4]); dc = s[4] === maxD ? '#ffffff' : '#a2a8bc'; }
        else if (variant === 'progress' && now && thin) { d = 'you are here'; dc = '#ffffff'; }
        const last = i === n - 1, first = i === 0;
        labels.push({ x: Math.round(blocks ? mid : 6 + x + sw), tx: blocks ? '-50%' : '-100%', name: s[0], d, dc, size: blocks ? 16 : 14, ink: done || now ? '#ffffff' : '#a2a8bc', al: blocks ? 'center' : 'flex-end' });
      }
      if (thin && s[2]) pips.push({ x: Math.round(x + sw), y: -1, c: i < reached ? '#ffffff' : 'rgba(255,255,255,.35)' });
      x += sw + gap;
    });
    if (thin && variant !== 'deaths') {
      const cx = S.slice(0, cur).reduce((a, s) => a + usable * s[1] / total, 0) + usable * S[cur][1] / total / 2;
      pips.push({ x: Math.round(cx), y: -14, c: variant === 'splits' ? '#ffffff' : accent });
    }
    const lab = { progress: classic ? 'Your progress' : 'Your progress', splits: 'Splits against your PB', deaths: 'Where the deaths went' }[variant];
    const sumP = { short: classic ? 'Finished · 3 parts' : 'Part 3 of 3', standard: finished ? 'Furthest: the boss · finished once' : 'Stage ' + (cur + 1) + ' of 7', long: 'Furthest: 4-4 · 28 of 48 sections', none: 'This game declares no sections' };
    const sumS = { short: '+0.6 after Part 2', standard: at >= 7 ? '+23.84 at the end' : '+46.1 after Stage 4', long: '+13.4 at the Clock tower boss', none: '' };
    const sumD = { short: 'most in Part 2', standard: 'most in Stage 4 (1,520)', long: 'most in 3-5 (311)', none: '' };
    const summary = variant === 'splits' ? sumS[len] : variant === 'deaths' ? sumD[len] : sumP[len];
    const facts = [{ k: 'furthest room you reached', v: 'Room 41 · [room name]' }, { k: 'save points touched', v: '17' }, { k: 'finished', v: 'Not yet' }];
    const headH = head ? 26 : 0;
    const lineH = blocks ? 22 : 12;
    return {
      w, h: headH + (n ? lineH + 50 : 50), head, label: n ? lab : 'Your progress', summary,
      hasLine: n > 0, noLine: n === 0, blocks, thin, segs, labels, pips, ticks, facts,
      lineY: headH + (thin ? 18 : 6), lineH, labelY: headH + (thin ? 18 : 6) + lineH + 6,
    };
  }
}
</script>
</body>
</html>
