<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standard engine menus for ports without their own</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes em-fruit{from{transform:translateX(0)}to{transform:translateX(-42px)}}
@keyframes em-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<!-- #100, #851: saves belong to the game. A port that has its own title, file select and difficulty select keeps them exactly as made, and Classic just opens the game. A port without them (a few early games boot straight into a room) gets the standard engine's menus: these three screens, drawn in game pixels inside the 800x608 game rectangle like every engine-made fangame, so they read as part of the game and not as our UI. They use the package's title, its key art and the delicious fruit as the selector. Input is the game's: Jump picks, Shoot goes back. The saves are the game's own save files; the client only reads them to show progress on the shelf. Frames shown at 0.7x. -->
<div style="position: relative; width: 1920px; height: 640px; overflow: hidden; background: #0b0d14; font-family: 'Barlow', system-ui, sans-serif; color: #f3f4f8; font-variant-numeric: tabular-nums">
  <div style="position: absolute; left: 64px; top: 40px; right: 64px; display: flex; gap: 48px">
    <sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 18px; font-weight: 700">{{f.name}}</span>
        <div style="position: relative; width: 560px; height: 426px; overflow: hidden; background: #000000; box-shadow: 0 20px 50px rgba(0,0,0,.5)">
          <div style="position: absolute; left: 0; top: 0; width: 800px; height: 608px; transform: scale(.7); transform-origin: 0 0; font-family: 'Pixelify Sans', monospace; color: #ffffff">
            <div style="position: absolute; inset: 0"><dc-import name="Backdrop" w="800px" h="608px" hue="300" scene="city" blur="0" dim="{{f.dim}}" tag="none" hint-size="800px,608px"></dc-import></div>
            <sc-if value="{{f.title}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 150px">
                <span style="font-size: 58px; font-weight: 700; line-height: 1; text-align: center; text-shadow: 5px 5px 0 #000000">I wanna help<br>the Fairy tale</span>
                <span style="font-size: 22px; font-weight: 500; text-shadow: 3px 3px 0 #000000">by れおちゅー</span>
                <span style="margin-top: 140px; font-size: 28px; font-weight: 600; text-shadow: 3px 3px 0 #000000; animation: em-blink 1s steps(1) infinite">PRESS SHIFT TO START</span>
              </div>
            </sc-if>
            <sc-if value="{{f.files}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; left: 90px; right: 90px; top: 70px; display: flex; flex-direction: column; gap: 22px">
                <span style="font-size: 40px; font-weight: 700; letter-spacing: .14em; text-align: center; text-shadow: 4px 4px 0 #000000">SELECT DATA</span>
                <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 14px">
                    <span style="width: 21px; height: 24px; flex: none; overflow: hidden; opacity: {{s.op}}"><img src="/_blob/23ec5474ca1d50c871f0d33d2c7f8d59" alt="" width="42" height="24" style="display: block; image-rendering: pixelated; animation: em-fruit 640ms steps(2) infinite"></span>
                    <div style="flex: 1; box-sizing: border-box; height: 112px; padding: 14px 20px; background: rgba(0,0,0,.9); border: 2px solid {{s.line}}; outline: 2px solid {{s.line}}; outline-offset: 3px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
                      <span style="font-size: 26px; font-weight: 700; color: {{s.ink}}">{{s.a}}</span>
                      <span style="font-size: 20px; font-weight: 500; color: {{s.sub}}">{{s.b}}</span>
                    </div>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{f.diff}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; left: 200px; right: 200px; top: 120px; box-sizing: border-box; padding: 26px 30px 30px; background: rgba(0,0,0,.94); border: 2px solid #ffffff; outline: 2px solid #ffffff; outline-offset: 3px; display: flex; flex-direction: column; gap: 14px">
                <span style="font-size: 34px; font-weight: 700; letter-spacing: .14em; text-align: center; padding-bottom: 6px">DIFFICULTY</span>
                <sc-for list="{{diffs}}" as="d" hint-placeholder-count="4">
                  <div style="display: flex; align-items: center; gap: 12px; height: 40px">
                    <span style="width: 21px; height: 24px; flex: none; overflow: hidden; opacity: {{d.op}}"><img src="/_blob/23ec5474ca1d50c871f0d33d2c7f8d59" alt="" width="42" height="24" style="display: block; image-rendering: pixelated; animation: em-fruit 640ms steps(2) infinite"></span>
                    <span style="font-size: 26px; font-weight: {{d.w}}; color: {{d.ink}}; transform: translateX({{d.x}}px)">{{d.name}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </div>
        <span style="width: 560px; font-size: 15px; line-height: 1.5; color: #c9cde0">{{f.text}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { name: 'Title', title: true, dim: 0.1, text: 'The package’s title, creator and key art, in the engine’s pixel type. Jump starts. Esc is still our pause menu, as everywhere in a run.' },
        { name: 'File select', files: true, dim: 0.55, text: 'Three save files, the standard engine’s layout: deaths and time as the game counts them. These are the game’s saves; the shelf only reads them (Your progress).' },
        { name: 'Difficulty select', diff: true, dim: 0.55, text: 'Only on a new file, listing the difficulties the package declares. A game whose difficulty is picked in a room (warps) keeps its room; this box is not added.' },
      ],
      slots: [['DATA 1', 'DEATHS 212   TIME 0:41:07'], ['DATA 2', 'NO DATA'], ['DATA 3', 'NO DATA']].map(([a, b], i) => ({ a, b, op: i === 0 ? 1 : 0, line: i === 0 ? '#ffffff' : '#6a6d78', ink: i === 0 ? '#ffffff' : '#a0a3ad', sub: i === 0 ? '#ffe08a' : '#6a6d78' })),
      diffs: ['MEDIUM', 'HARD', 'VERY HARD', 'IMPOSSIBLE'].map((name, i) => ({ name, op: i === 1 ? 1 : 0, w: i === 1 ? 700 : 500, ink: i === 1 ? '#ffffff' : '#8d909e', x: i === 1 ? 4 : 0 })),
    };
  }
}
</script>
</body>
</html>
