[workspace]
resolver = "3"
members = ["crates/sim", "crates/format", "crates/tools", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/nugamus/iwbtg-collection"

# Exact pins: any change here can change simulation outcomes (docs/architecture/replay.md, Versions).
[workspace.dependencies]
iwbtg-sim = { path = "crates/sim" }
iwbtg-format = { path = "crates/format" }
# Rhai features per docs/decisions/0001-script-language.md and docs/plans/sim-core.md section 11.
# WP9 owns this line. Pinned at 1.27.0 (14 days old on 2026-11-04) with compact_str (decision 0001).
rhai = { version = "=1.27.0", default-features = false, features = [
  "std",
  "only_i64",
  "no_time",
  "no_module",
  "no_custom_syntax",
  "no_closure",
  "compact_str",
  "internals",
] }
libm = { version = "=0.2.16", default-features = false }
smallvec = { version = "=1.16.4", features = ["serde"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
postcard = { version = "=1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
png = "0.18.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.60.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "warn"

# Local build speed (docs/dev-setup.md, Build speed): line tables only for our crates (backtraces
# keep file and line), no debug info for dependencies. Faster links, a much smaller target/.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Integer overflow panics in release too, so debug tests and release servers behave the same
# (docs/plans/sim-core.md 10.3). Sim counters use checked_* and never rely on this.
[profile.release]
overflow-checks = true
