[workspace]
resolver = "3"
members = ["crates/sim", "crates/format", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/nugamus/iwbtg-collection"

# Exact pins: any change here can change simulation outcomes (docs/architecture.md, Versions).
[workspace.dependencies]
iwbtg-sim = { path = "crates/sim" }
iwbtg-format = { path = "crates/format" }
rhai = { version = "=1.26.1", default-features = false, features = ["std", "no_custom_syntax", "internals"] }
libm = { version = "=0.2.16", default-features = false }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
postcard = { version = "=1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
png = "0.18.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "warn"

[profile.dev.package."*"]
opt-level = 2
