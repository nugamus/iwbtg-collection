# wasm32-unknown-unknown test binaries (iwbtg-sim, #206) run under node through wasm-bindgen-test.
# The runner is the wasm-bindgen CLI; its version must equal wasm-bindgen's in Cargo.lock
# (`cargo install wasm-bindgen-cli --version <that> --locked`).
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# rust-lld links the Bevy client about twice as fast as link.exe (docs/dev-setup.md, Build speed).
# The rustup toolchain ships it; the MSVC libraries are still found as with link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
