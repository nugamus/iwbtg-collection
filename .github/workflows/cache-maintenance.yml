name: CI cache maintenance
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: ci-cache-maintenance
  cancel-in-progress: false
jobs:
  prune:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted main, never the source workflow's artifact or a PR checkout.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - run: python3 scripts/prune_ci_cache.py --repo "$GITHUB_REPOSITORY" --apply
        env:
          GH_TOKEN: ${{ github.token }}
