name: Release
# Tagged release builds for Windows and Linux (#71). A `v*` tag builds the client, packages it
# with the showcase package and the licence files, and uploads both zips to that tag's GitHub
# release. `workflow_dispatch` runs the same builds and artifacts without creating a release, so
# the workflow can be validated without publishing anything.
#
# The bundle ships the one package in this repository (`crates/client/showcase.pkg`). "Starter
# games bundled" (five games, a user decision in #51) and the full all-ported-games build wait on
# #51 and the ported packages; they are the remaining unchecked box on #71. No installer is built:
# the artifact is a zip the user extracts and runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A release must not be cancelled by a later tag push in the same ref group.
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, artifact: iwbtg-client-windows-x86_64}
          - {os: ubuntu-latest, artifact: iwbtg-client-linux-x86_64}
    runs-on: ${{ matrix.os }}
    # A cold release build of the Bevy client is the long part; the same bound as the native job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      # Bevy's windowing and audio need the system libraries on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # A tag build ships; keep its cache generation. Dispatch runs only restore.
          save-if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: cargo build -p iwbtg-client --release --locked
      - name: Stage the release folder
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          stage="dist/$ARTIFACT"
          mkdir -p "$stage/LICENSES"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/iwbtg-client.exe "$stage/"
          else
            cp target/release/iwbtg-client "$stage/"
          fi
          cp -R crates/client/showcase.pkg "$stage/"
          cp THIRD_PARTY_LICENSES NOTICE LICENSE-MIT "$stage/"
          cp LICENSES/*.txt "$stage/LICENSES/"
          cat > "$stage/README.txt" <<'TXT'
          IWBTG Collection client
          =======================

          Run:  iwbtg-client showcase.pkg

          showcase.pkg is the bundled package. On Linux the binary needs the usual windowing and
          audio libraries (Wayland or X11, libxkbcommon, libxcursor, libxi, libxrandr, libudev,
          libasound); install your distribution's equivalents.

          Licences: LICENSE-MIT (this project), NOTICE (fonts and game content),
          THIRD_PARTY_LICENSES (Rust crates) and LICENSES/ (licence texts).
          TXT
      - name: Pack the release zip
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          cd dist
          # Python is installed on both hosted runners; `python3` is the Linux name.
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; else py=python3; fi
          "$py" -m zipfile -c "$ARTIFACT.zip" "$ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          # Long enough to inspect a dispatch run; a tag also publishes the same zip.
          retention-days: 7

  # Only a tag publishes. The dispatch path stops at the artifacts above, so validating this
  # workflow never creates a release (that is outward-facing and needs the user).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload the zips to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.zip --clobber
