name: progress

on:
  # The daily schedule is a backstop. The cron added 2026-11-24 never fired:
  # the Actions API has zero `schedule` runs for this repository, so a day of
  # merges that touch no progress path leaves the site stale (#1547).
  schedule:
    - cron: "17 4 * * *"
  # A successful CI run on main is the reliable refresh. It covers every
  # merge, not only the progress/docs/games paths below; unchanged data is
  # still published as "no publish change".
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "progress/**"
      - "docs/games/**"
      - ".github/workflows/progress.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read
  pages: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  build:
    # workflow_run also fires for failed/cancelled CI; only refresh after a
    # successful main run. The schedule, dispatch and push triggers always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the durable history from gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git show origin/gh-pages:history.json > progress/history.json 2>/dev/null || true
          fi

      - name: Generate the dashboard from committed files plus gh
        run: python -I progress/generate.py --gh --history --require-gh

      - name: Publish to gh-pages and fail visibly
        run: |
          worktree=$(mktemp -d)
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add "$worktree" -B gh-pages origin/gh-pages
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" checkout --orphan gh-pages
            git -C "$worktree" rm -rf . -q || true
          fi
          cp progress/index.html progress/data.json progress/history.json "$worktree/"
          mkdir -p "$worktree/fonts"
          cp progress/fonts/* "$worktree/fonts/"
          touch "$worktree/.nojekyll"
          git -C "$worktree" add index.html data.json history.json .nojekyll fonts
          if git -C "$worktree" diff --cached --quiet; then
            echo "no publish change"
          else
            git -C "$worktree" config user.name "github-actions[bot]"
            git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$worktree" commit -m "progress: publish ${GITHUB_SHA:0:7} [skip ci]"
            git -C "$worktree" push origin HEAD:gh-pages
          fi

      # Pages is source-from-branch (gh-pages): the push above triggers the
      # pages-build-deployment workflow automatically. Do not POST
      # /pages/builds here: it raced the automatic build, and its empty-body
      # response failed runs after a successful publish (#1570).
