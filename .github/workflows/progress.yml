name: progress

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "progress/**"
      - "docs/games/**"
      - ".github/workflows/progress.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard from committed files plus gh
        run: python -I progress/generate.py --gh --history

      - name: Commit the refreshed snapshot and history (best effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress/data.json progress/history.json progress/index.html
          if git diff --cached --quiet; then
            echo "no snapshot change"
          else
            git commit -m "progress: refresh snapshot [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: progress

      - id: deploy
        uses: actions/deploy-pages@v4
