name: Fuzz
# Nightly fuzzing of the untrusted inputs (#809, #981). Linux only: the sim must never panic
# (wasm32 aborts on panic), and libFuzzer needs nightly. Never runs on a PR; `ci-ok` stays clean.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"
permissions:
  contents: read
concurrency:
  group: fuzz
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [iwbz, package_load, replay, script]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          # Workspace-excluded crate: cache its own target folder.
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '600' }}
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cargo +nightly fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET"
      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/crash-*
          if-no-files-found: ignore
