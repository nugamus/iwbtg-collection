name: Latest build
# Every green CI run on `main` publishes the Windows client twice (#1606, #1675):
#
# - its own release, tagged `build-<CI run number>-<short sha>` and marked a pre-release, so every
#   green commit of main has a GitHub release of its own (the newest BUILDS_KEPT are kept);
# - the rolling release tagged `latest`, which the client checks and updates itself from, so a
#   tester never compiles.
#
# Triggered by CI's success rather than a second `push` trigger so the published exe is exactly
# the tree CI passed (the same workflow_run head SHA). CI on main runs one generation at a time
# with the newest push pending, so commits pushed while CI runs are tested, and released, together
# with the newest one; the release notes list every PR since the previous build.
#
# Builds run side by side, never cancelled, so no green commit loses its release. Only the
# rolling `latest` step is serialised, and it moves only forwards: a build whose commit is not
# newer than the one `latest` holds leaves it alone. build.json names the commit, date, version
# and the titles of the PRs merged since the previous build.
#
# Per-commit tags never start with `v`: `v*` tags are the versioned releases of release.yml.
#
# Only Windows is published for now. The web build is untouched, and nothing here needs a token
# other than the default GITHUB_TOKEN.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
env:
  # How many per-commit `build-*` releases stay; older ones and their tags are deleted.
  BUILDS_KEPT: 50
jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI passed, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the client
        env:
          # Read at compile time by `updater::BUILD_COMMIT` / `BUILD_DATE` (`option_env!`).
          IWBTG_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          IWBTG_BUILD_DATE: ${{ github.event.workflow_run.updated_at }}
        run: cargo build -p iwbtg-client --release --locked
      - name: Stage the release folder
        shell: bash
        env:
          ARTIFACT: IWBTG-Collection-windows-x64
        run: |
          set -euo pipefail
          stage="dist/$ARTIFACT"
          mkdir -p "$stage/LICENSES"
          cp target/release/iwbtg-client.exe "$stage/"
          cp -R crates/client/showcase.pkg "$stage/"
          cp THIRD_PARTY_LICENSES NOTICE LICENSE-MIT "$stage/"
          cp LICENSES/*.txt "$stage/LICENSES/"
          cat > "$stage/README.txt" <<'TXT'
          IWBTG Collection
          ================

          Double-click iwbtg-client.exe. It opens the main menu on this folder, where the
          client checks for updates.

          To use another folder of packages:

            iwbtg-client.exe --select <folder>

          Or play one package directly (no update checks run in a run):

            iwbtg-client.exe showcase.pkg

          This is a development build of main, replaced after every green CI run. The client
          updates its own .exe from this release; saves, settings, stats and packages are never
          touched. Licences: LICENSE-MIT (this project), NOTICE (fonts and game content),
          THIRD_PARTY_LICENSES (Rust crates) and LICENSES/ (licence texts).
          TXT
      - name: Pack the zip and hash it
        shell: bash
        env:
          ARTIFACT: IWBTG-Collection-windows-x64
        run: |
          set -euo pipefail
          cd dist
          py=python
          "$py" - "$ARTIFACT" <<'PY'
          import hashlib, pathlib, sys, zipfile
          name = sys.argv[1]
          with zipfile.ZipFile(f"{name}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for path in sorted(pathlib.Path(name).rglob("*")):
                  if path.is_file():
                      z.write(path, path.as_posix())
          digest = hashlib.sha256(pathlib.Path(f"{name}.zip").read_bytes()).hexdigest()
          pathlib.Path("sha256.txt").write_text(f"{digest}  {name}.zip\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: IWBTG-Collection-windows
          path: |
            dist/IWBTG-Collection-windows-x64.zip
            dist/sha256.txt
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: IWBTG-Collection-windows
          path: dist
      - name: Collect what changed since the previous build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_DATE: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p prev
          base=""
          if gh release view latest >/dev/null 2>&1; then
            gh release download latest --pattern build.json --dir prev --clobber || true
            if [ -f prev/build.json ]; then
              base=$(python - <<'PY'
          import json
          print(json.load(open("prev/build.json", encoding="utf-8")).get("commit", ""))
          PY
              )
            fi
          fi
          if [ -n "$base" ]; then
            gh api "repos/$GH_REPO/compare/$base...$HEAD_SHA" > compare.json
          else
            # First build: there is no previous manifest, so the last 20 commits stand in.
            gh api "repos/$GH_REPO/commits?sha=$HEAD_SHA&per_page=20" > compare.json
          fi
          python3 - compare.json <<'PY' > what-changed.json
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          commits = data.get("commits", []) if isinstance(data, dict) else data
          numbers = []
          for commit in commits:
              message = commit["commit"]["message"]
              match = re.search(r"\(#(\d+)\)", message.splitlines()[0])
              if match and int(match.group(1)) not in numbers:
                  numbers.append(int(match.group(1)))
          print(json.dumps(numbers))
          PY
          python3 - <<'PY' > prs.json
          import json, os, subprocess
          numbers = json.load(open("what-changed.json", encoding="utf-8"))
          titles = []
          for number in numbers:
              out = subprocess.run(
                  ["gh", "api", f"repos/{os.environ['GH_REPO']}/pulls/{number}", "--jq", ".title"],
                  capture_output=True, text=True)
              if out.returncode == 0 and out.stdout.strip():
                  titles.append(out.stdout.strip())
          print(json.dumps(titles))
          PY
          python3 - "$HEAD_SHA" <<'PY'
          import json, os, pathlib, tomllib
          titles = json.load(open("prs.json", encoding="utf-8"))
          head = os.environ["HEAD_SHA"]
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          payload = {
              "commit": head,
              "date": os.environ["BUILD_DATE"],
              "version": version,
              "prs": titles,
          }
          pathlib.Path("dist/build.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          lines = [f"### latest {head[:7]}", ""]
          lines += [f"- {title}" for title in titles] or ["- No merged PR titles found since the previous build."]
          lines += ["", f"Built from `{head}`. The client on the main menu updates itself to this build."]
          pathlib.Path("notes.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Publish this commit's own release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          tag="build-${RUN_NUMBER}-${HEAD_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists (a re-run): its assets are replaced"
            gh release upload "$tag" \
              dist/IWBTG-Collection-windows-x64.zip dist/sha256.txt dist/build.json --clobber
          else
            gh release create "$tag" \
              dist/IWBTG-Collection-windows-x64.zip dist/sha256.txt dist/build.json \
              --target "$HEAD_SHA" --prerelease --latest=false \
              --title "IWBTG Collection — build ${RUN_NUMBER} (${HEAD_SHA:0:7})" --notes-file notes.md
          fi
      - name: Keep the newest per-commit releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("build-")) | [.created_at, .tag_name] | @tsv' \
            | sort -r | tail -n +$((BUILDS_KEPT + 1)) | cut -f2 \
            | while read -r old; do
                gh release delete "$old" --yes --cleanup-tag || true
              done
      - uses: actions/upload-artifact@v4
        with:
          name: IWBTG-Collection-latest
          path: |
            dist/IWBTG-Collection-windows-x64.zip
            dist/sha256.txt
            dist/build.json
            notes.md
          retention-days: 7

  latest:
    # The rolling release the client updates from. One at a time; a newer build waiting replaces
    # an older one waiting, and the step below never moves `latest` backwards.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: latest-rolling
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: IWBTG-Collection-latest
          path: out
      - name: Is this build newer than the one `latest` holds?
        id: newer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p held
          held=""
          if gh release download latest --pattern build.json --dir held --clobber 2>/dev/null; then
            held=$(python3 -c 'import json; print(json.load(open("held/build.json")).get("commit", ""))')
          fi
          newer=true
          if [ -n "$held" ]; then
            # `ahead`: this commit comes after the held one on main.
            status=$(gh api "repos/$GH_REPO/compare/$held...$HEAD_SHA" --jq .status || echo unknown)
            [ "$status" = ahead ] || newer=false
            echo "latest holds ${held:0:7}; this build is ${HEAD_SHA:0:7}: $status"
          fi
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
      - name: Move the tag to the built commit
        if: steps.newer.outputs.newer == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git tag -f latest "$HEAD_SHA"
          git push --force origin refs/tags/latest
      - name: Publish the rolling release
        if: steps.newer.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "IWBTG Collection — Latest" --notes-file out/notes.md
          else
            # The tag was pushed to HEAD in the step above; the release follows it.
            gh release create latest --title "IWBTG Collection — Latest" --notes-file out/notes.md
          fi
          gh release upload latest \
            out/IWBTG-Collection-windows-x64.zip out/sha256.txt out/build.json --clobber
