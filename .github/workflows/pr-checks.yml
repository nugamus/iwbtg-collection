name: PR checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  body:
    runs-on: ubuntu-latest
    steps:
      - name: PR links an issue and fills in docs and follow-ups
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          echo "$BODY" | grep -Eiq '(closes|fixes|resolves) +([a-z0-9_.-]+/[a-z0-9_.-]+)?#[0-9]+' || { echo "::error::PR body needs 'Closes #<issue>'"; fail=1; }
          for s in "Docs updated" "Follow-up issues" "User check"; do
            sec=$(echo "$BODY" | awk -v h="## $s" '$0==h{f=1;next} /^## /{f=0} f' | grep -v '^\s*$' | grep -v -e 'Which docs this PR' -e 'Issues filed for findings' -e 'Commands to run')
            [ -n "$sec" ] || { echo "::error::Fill in the '$s' section"; fail=1; }
          done
          exit $fail
