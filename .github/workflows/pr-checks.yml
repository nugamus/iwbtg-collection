name: PR checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:   # the body was checked when the PR joined the queue; this run only reports success
jobs:
  body:
    runs-on: ubuntu-latest
    env:
      # An issue link counts only as a line convention: a line that begins (after an optional
      # list marker) with a keyword and an issue reference. `Closes`/`Fixes`/`Resolves` close;
      # `Part of`/`Refs`/`Tracking:` link without closing. A keyword inside a sentence is prose.
      LINK_LINE: '^[[:space:]]*([-*+][[:space:]]+)?(closes|fixes|resolves|part[[:space:]]+of|refs|tracking):?[[:space:]]+([a-z0-9_.-]+/[a-z0-9_.-]+)?#[0-9]+'
    steps:
      - name: Self-test the issue-link line pattern
        run: |
          matches() { printf '%s\n' "$1" | grep -Eiq "$LINK_LINE"; }
          expect() {
            if matches "$2"; then echo "ok: $1"; else echo "::error::the body pattern should match $1"; exit 1; fi
          }
          reject() {
            if matches "$2"; then echo "::error::the body pattern should not match $1"; exit 1; else echo "ok: $1"; fi
          }
          expect "a closing line" 'Closes #1445'
          expect "a closing line with a repo" 'Fixes owner/repo#12'
          expect "a part-of line" 'Part of #1445'
          expect "a refs line" 'Refs #12'
          expect "a tracking line" 'Tracking: #7'
          expect "a list marker" '- Closes #7'
          reject "no link" 'No issue reference here.'
          reject "a closing keyword in prose" 'This PR closes #1445 in prose.'
      - name: PR links an issue and fills in docs and follow-ups
        env:
          BODY: ${{ github.event.pull_request.body }}
        if: github.event_name == 'pull_request'
        run: |
          # printf, not echo: a backslash in the body (Windows paths) must not cut it short.
          # Nothing may end the script before it reports: grep exits 1 on an empty section, so
          # that pipeline ends in `|| true` and the message below is printed instead.
          fail=0
          body=$(printf '%s\n' "$BODY" | tr -d '\r')
          printf '%s\n' "$body" | grep -Eiq "$LINK_LINE" || { echo "::error::PR body needs an issue link on its own line: 'Closes #<issue>' when this PR finishes the issue, or 'Part of #<issue>' / 'Refs #<issue>' when it is one part of a multi-repo issue. A keyword in prose does not count."; fail=1; }
          for s in "Docs updated" "Follow-up issues" "User check"; do
            sec=$(printf '%s\n' "$body" | awk -v h="## $s" '$0==h{f=1;next} /^## /{f=0} f' | grep -v '^\s*$' | grep -v -e 'Which docs this PR' -e 'Issues filed for findings' -e 'Commands to run' || true)
            [ -n "$sec" ] || { echo "::error::Fill in the '$s' section"; fail=1; }
          done
          exit $fail
