name: CI
# Every PR runs this workflow so the required `ci-ok` check always reports (auto-merge, #528).
# PRs select changed crates and transitive consumers; main/merge groups retain the full matrix.
# Test-consumed docs select sim/format; ordinary documentation skips builds.
# Every job sets `timeout-minutes` (#967): a wedged step fails and reports after minutes instead of
# holding `ci-ok` and auto-merge for GitHub's 6 hour default. The native cap is 45 minutes: a full
# Windows run measured 28m36s on a cold-ish cache (#1041, run 44531896479), and main also runs the
# Rust-cache save there; the warm path is about 5.5 minutes. The three wasm/browser caps stay 25
# (slowest wasm cold measurement 11m33s, #961); everything else is 5 to 15.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  # PR and merge-group runs still cancel superseded work. A push to main does not cancel the
  # active run: that trusted generation finishes and publishes its caches, and GitHub keeps the
  # newest push as the single pending run for the group (#1027). This bounds main to one running
  # plus one pending run instead of starving cache saves during a burst of merges.
  cancel-in-progress: ${{ github.event_name != 'push' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Faster CI builds: no incremental state and no debug info (neither is used on a runner).
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      packages: ${{ steps.diff.outputs.packages }}
      wasip1: ${{ steps.diff.outputs.wasip1 }}
      browser: ${{ steps.diff.outputs.browser }}
      web: ${{ steps.diff.outputs.web }}
      determinism: ${{ steps.diff.outputs.determinism }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/ci_scope.py --base "$BASE" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_scope.py --full --github-output "$GITHUB_OUTPUT"
          fi
      - name: Workflow selector, metrics and agent hook tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -I .claude/stats.py --test
          python3 -I .claude/hooks/build_guard.py --test
          python3 -I .claude/hooks/conflict_guard.py --test
          python3 -I .claude/hooks/issues.py --test

  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
    defaults:
      run:
        shell: bash
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A full-coverage Windows run measured 28m36s on a cold-ish cache (#1041); the warm path is
    # about 5m30s. 45 minutes leaves room for the main-only cache save without keeping a wedged
    # job for GitHub's default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup show   # installs the toolchain from rust-toolchain.toml
      # Formatting needs neither the cache nor system libraries, so report it before either. A
      # format-only failure used to wait until after Clippy and the whole test build (#1031).
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Bevy's windowing (winit, wayland, x11) needs system libraries on Linux.
      - if: runner.os == 'Linux' && contains(needs.changes.outputs.packages, '-p iwbtg-client')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy $PACKAGES --tests --locked -- -D warnings
      - run: cargo test $PACKAGES --locked
      # The golden package is in canonical form (`iwbtg pkg fmt`); the games repo runs the same check.
      - if: runner.os == 'Linux' && needs.changes.outputs.determinism == 'true'
        run: cargo run -p iwbtg-tools --locked -- pkg fmt crates/sim/tests/golden/one_room.pkg --check

  # The two wasm targets build and test the same crates but share no build artifacts, so they run as
  # two jobs in parallel (#961). Sequential, the golden corpus alone took 8 min under wasmtime plus
  # 5 min under node on a cold cache, and every auto-merge waited for both. Each job still runs
  # every command the single `wasm32` job ran; none of them was dropped or moved to main/nightly.
  wasm32-wasip1:
    needs: changes
    if: needs.changes.outputs.wasip1 == 'true'
    runs-on: ubuntu-latest
    # Slowest measured 9m12s (cold cache, #961); the golden corpus alone can take 8 min.
    timeout-minutes: 25
    env:
      # Tests read fixtures through absolute paths, so the whole file system is visible to them.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/
      # The golden corpus is nearly all of this job's wall time, and the default `test` profile is
      # unoptimized (#966). One level of optimization cuts the wasm run many-fold for seconds more
      # compile. Only the opt-level changes: debug assertions and overflow checks stay on, and no
      # local profile or `.cargo/config.toml` is touched.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # wasm32-wasip1 aborts on panic. This job runs the library tests and the `fixtures` target;
      # the package-loading modules (`load_*` in `tests/it.rs`) run on the native jobs.
      # `cargo test -p iwbtg-sim` runs the golden corpus here too (tests/golden_corpus.rs): it is
      # ~4 min under wasmtime on a warm cache and is most of this job's wall time.
      - run: cargo test -p iwbtg-sim --target wasm32-wasip1 --locked
      - run: cargo test -p iwbtg-format --lib --test fixtures --target wasm32-wasip1 --locked

  wasm32-unknown-unknown:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # Slowest measured 11m33s (cold cache, #961).
    timeout-minutes: 25
    env:
      # The same optimized test profile as wasm32-wasip1 (#966). `cargo build` and Clippy use the
      # dev profile, so only the test binaries below change.
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.wasip1 == 'true'
        run: cargo build -p iwbtg-sim -p iwbtg-format --target wasm32-unknown-unknown --locked
      # The client's browser build (it opens the UI gallery; docs/dev-setup.md, UI gallery in a browser).
      # Clippy compiles the whole crate, including the web-only code (storage.rs localStorage backend),
      # and replaces a plain `cargo build` of the client: same errors, no codegen, plus the lints.
      - run: cargo clippy -p iwbtg-client --target wasm32-unknown-unknown --locked -- -D warnings
      # The runner (.cargo/config.toml) is the wasm-bindgen CLI, which must match the lock file;
      # the composite action installs it (and the test runner) with a checksum.
      - uses: ./.github/actions/wasm-bindgen
        if: needs.changes.outputs.wasip1 == 'true'
      # The golden corpus again, this time linked for wasm32-unknown-unknown and run under node.
      - if: needs.changes.outputs.wasip1 == 'true'
        run: cargo test -p iwbtg-sim --test determinism --test golden_corpus --target wasm32-unknown-unknown --locked

  # The browser page a playtest uses (#29, #1078): the release wasm plus the pinned wasm-bindgen
  # output, a compressed-size budget, and a headless-browser load of a fixture package. Selected
  # only when the client itself (including crates/client/web/) changed, not for sim/format-only
  # changes, which the wasm job above already lints.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The cold release wasm build is the long part; the same bound as the other wasm jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/wasm-bindgen
      - name: Build the browser bundle
        timeout-minutes: 20
        run: |
          cargo build -p iwbtg-client --release --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --no-typescript --out-dir crates/client/web/pkg target/wasm32-unknown-unknown/release/iwbtg-client.wasm
      # The budget is the compressed wasm a server sends; scripts/check_web_size.py fails on growth.
      - name: Check the compressed wasm size
        timeout-minutes: 2
        run: python3 -I scripts/check_web_size.py crates/client/web/pkg/iwbtg-client_bg.wasm
      # A downloadable bundle should be playable without another build: the showcase is the one
      # package a tester plays (docs/architecture/client/view.md, The showcase).
      - name: Pack the showcase for the artifact
        timeout-minutes: 5
        run: cargo run -q -p iwbtg-tools --locked -- pkg pack crates/client/showcase.pkg -o crates/client/web/showcase.iwbz
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: |
            crates/client/web/index.html
            crates/client/web/pkg
            crates/client/web/showcase.iwbz
          # The bundle is large; keep it long enough for a playtest, not forever.
          retention-days: 7
      # Packs the fixture, serves the page and asserts the browser logs the same gameplay hash
      # native `iwbtg pkg pack` prints (scripts/web_smoke.py).
      - name: Headless browser smoke test
        timeout-minutes: 8
        run: python3 -I scripts/web_smoke.py --web-dir crates/client/web --package-dir crates/client/tests/fixtures/clear.pkg

  # `iwbtg determinism report` on every target that can run the CLI; the next job requires the
  # three outputs to be byte-identical (docs/plans/sim-core.md 10.6). wasm32-unknown-unknown
  # checks the same lines through the `golden_corpus` test in the wasm32 job.
  determinism-report:
    needs: changes
    if: needs.changes.outputs.determinism == 'true'
    name: determinism report (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: wasm32-wasip1, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    # Slowest measured 2m39s (wasm32-wasip1), with room for a cold build.
    timeout-minutes: 15
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.target == 'wasm32-wasip1'
        uses: bytecodealliance/actions/wasmtime/setup@v1
      # An absolute corpus path: wasmtime only maps `/` (`--dir=/`), not the working directory.
      - run: cargo run -p iwbtg-tools --target ${{ matrix.target }} --locked -- determinism report "$GITHUB_WORKSPACE/crates/sim/tests/golden" --check > report.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.target }}
          path: report.txt

  determinism-compare:
    needs: [changes, determinism-report]
    if: needs.changes.outputs.determinism == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: Every target printed the same bytes
        run: |
          ls -R .
          # Windows may write CRLF; the report is compared as text lines.
          for f in determinism-*/report.txt; do tr -d '\015' < "$f" > "$f.lf"; done
          first=$(ls determinism-*/report.txt.lf | head -1)
          cat "$first"
          for f in determinism-*/report.txt.lf; do diff "$first" "$f"; done

  # No entropy, clock, thread or GPU crate may enter the sim's dependency graph
  # (docs/architecture.md, Sim purity). `cargo deny` on the workspace sees every crate, so this
  # runs on the sim alone with its own config.
  sim-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cargo-deny
        with:
          arguments: --manifest-path crates/sim/Cargo.toml --config crates/sim/deny.toml
          command: check bans

  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/cargo-deny
        with:
          command: check licenses

  # The one required check: green when every job above passed or was skipped for a docs-only change.
  ci-ok:
    needs: [changes, native, wasm32-wasip1, wasm32-unknown-unknown, web, determinism-report, determinism-compare, sim-deps, licenses]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a CI job ended with: $r"; exit 1;; esac
          done
