name: CI
# Every PR runs this workflow so the required `ci-ok` check always reports (auto-merge, #528).
# A change that touches only docs, Markdown, workspace/ or .claude/ skips the build jobs.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Faster CI builds: no incremental state and no debug info (neither is used on a runner).
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$BASE" HEAD | grep -vE '^(docs/|workspace/|\.claude/)|\.md$' || true)
          echo "$code"
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show   # installs the toolchain from rust-toolchain.toml
      # Bevy's windowing (winit, wayland, x11) needs system libraries on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --tests --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # The golden package is in canonical form (`iwbtg pkg fmt`); the games repo runs the same check.
      - if: runner.os == 'Linux'
        run: cargo run -p iwbtg-tools --locked -- pkg fmt crates/sim/tests/golden/one_room.pkg --check

  wasm32:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Tests read fixtures through absolute paths, so the whole file system is visible to them.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # wasm32-wasip1 aborts on panic, and the WP0 stubs that are not merged yet panic. The format
      # integration tests that load whole packages (wp7a_*) go through them, so they run on
      # native targets only until WP11 removes the stubs.
      - run: cargo test -p iwbtg-sim --target wasm32-wasip1 --locked
      - run: cargo test -p iwbtg-format --lib --test fixtures --target wasm32-wasip1 --locked
      - run: cargo build -p iwbtg-sim -p iwbtg-format --target wasm32-unknown-unknown --locked
      # The runner (.cargo/config.toml) is the wasm-bindgen CLI, which must match the lock file.
      - name: Install wasm-bindgen CLI at the locked version
        run: |
          v=$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: cargo test -p iwbtg-sim --test wp1_determinism --test golden_corpus --target wasm32-unknown-unknown --locked

  # `iwbtg determinism report` on every target that can run the CLI; the next job requires the
  # three outputs to be byte-identical (docs/plans/sim-core.md 10.6). wasm32-unknown-unknown
  # checks the same lines through the `golden_corpus` test in the wasm32 job.
  determinism-report:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: determinism report (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: wasm32-wasip1, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache: PR runs restore it and skip the slow save (Windows: minutes).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.target == 'wasm32-wasip1'
        uses: bytecodealliance/actions/wasmtime/setup@v1
      # An absolute corpus path: wasmtime only maps `/` (`--dir=/`), not the working directory.
      - run: cargo run -p iwbtg-tools --target ${{ matrix.target }} --locked -- determinism report "$GITHUB_WORKSPACE/crates/sim/tests/golden" --check > report.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.target }}
          path: report.txt

  determinism-compare:
    needs: determinism-report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: Every target printed the same bytes
        run: |
          ls -R .
          # Windows may write CRLF; the report is compared as text lines.
          for f in determinism-*/report.txt; do tr -d '\015' < "$f" > "$f.lf"; done
          first=$(ls determinism-*/report.txt.lf | head -1)
          cat "$first"
          for f in determinism-*/report.txt.lf; do diff "$first" "$f"; done

  # No entropy, clock, thread or GPU crate may enter the sim's dependency graph
  # (docs/architecture.md, Sim purity). `cargo deny` on the workspace sees every crate, so this
  # runs on the sim alone with its own config.
  sim-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/sim/Cargo.toml
          arguments: --config crates/sim/deny.toml
          command: check bans

  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # The one required check: green when every job above passed or was skipped for a docs-only change.
  ci-ok:
    needs: [changes, native, wasm32, determinism-report, determinism-compare, sim-deps, licenses]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a CI job ended with: $r"; exit 1;; esac
          done
