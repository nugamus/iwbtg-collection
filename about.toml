# cargo-about configuration for THIRD_PARTY_LICENSES (issue #70).
#
# Generate the file from the repository root:
#   cargo about generate --output-file THIRD_PARTY_LICENSES about.hbs
#
# The accepted list mirrors deny.toml (the licences `cargo deny check licenses` allows), so a
# crate that passes the licence gate resolves to one of the licences listed here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "MPL-2.0",
]

# The file ships with the Windows and Linux release builds (#71); a crate pulled in only for
# another target (wasm32) is not part of them.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Workspace crates are first-party (publish = false); THIRD_PARTY_LICENSES lists only crates
# from outside the workspace.
private = { ignore = true }

# Tests do not ship with the release builds, so a crate only used by a test is not listed.
ignore-dev-dependencies = true
